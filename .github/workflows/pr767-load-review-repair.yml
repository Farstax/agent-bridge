name: PR 767 load review repair

on:
  push:
    branches: [feature/763-acp-session-config]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/763-acp-session-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Apply load-session repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          client = Path('src/acp/client.ts')
          text = client.read_text()
          old = "    latestConfigOptions = setupState.configOptions ?? [];\n    const applied = await applySessionSettings(agent, acpSessionId, setupState, input);\n    latestConfigOptions = applied.configOptions;"
          new = "    // A load/resume may replay authoritative config_option_update notifications\n    // while returning no configOptions of its own. Preserve that projected\n    // catalogue unless the setup response explicitly supplied a replacement.\n    if (setupState.configOptions != null) latestConfigOptions = setupState.configOptions;\n    const effectiveSetupState = setupState.configOptions != null\n      ? setupState\n      : { ...setupState, configOptions: latestConfigOptions };\n    const applied = await applySessionSettings(agent, acpSessionId, effectiveSetupState, input);\n    latestConfigOptions = applied.configOptions;"
          assert old in text, 'ACP setup-state block changed unexpectedly'
          client.write_text(text.replace(old, new, 1))

          test = Path('test/acpSessionConfig.test.ts')
          text = test.read_text()
          anchor = '  it("sends the literal default ACP value but sends nothing for Bridge provider-default policy", async () => {'
          regression = dedent('''\
            it("uses config replayed during session/load when the load response omits configOptions", async () => {
              const calls: Array<[string, string]> = [];
              const agent = acp.agent({ name: "load-config-replay-fixture" })
                .onRequest(acp.methods.agent.initialize, async () => ({
                  protocolVersion: acp.PROTOCOL_VERSION,
                  agentCapabilities: { loadSession: true },
                }))
                .onRequest(acp.methods.agent.session.load, async (ctx) => {
                  await ctx.client.notify(acp.methods.client.session.update, {
                    sessionId: ctx.params.sessionId,
                    update: {
                      sessionUpdate: "config_option_update",
                      configOptions,
                    } as any,
                  });
                  return {} as any;
                })
                .onRequest(acp.methods.agent.session.setConfigOption, async (ctx) => {
                  calls.push([ctx.params.configId, String(ctx.params.value)]);
                  return {
                    configOptions: configOptions.map((option) =>
                      option.id === ctx.params.configId
                        ? { ...option, currentValue: String(ctx.params.value) }
                        : option,
                    ),
                  } as any;
                })
                .onRequest(acp.methods.agent.session.prompt, async (ctx) => {
                  await ctx.client.notify(acp.methods.client.session.update, {
                    sessionId: ctx.params.sessionId,
                    update: { sessionUpdate: "agent_message_chunk", content: { type: "text", text: "loaded" } },
                  });
                  return { stopReason: "end_turn" };
                });

              const result = await runAcpTurn({
                peer: agent,
                cwd: process.cwd(),
                conversationId: "bridge-load-replay",
                runId: "run-load-replay",
                existingAcpSessionId: "existing-acp-session",
                prompt: "again",
                executionMode: "safe",
                sessionConfig: [{ category: "model", explicitValue: "opus" }],
              });

              expect(result.sessionMode).toBe("load");
              expect(calls).toEqual([["model-selector", "opus"]]);
              expect(result.configOptions).toEqual(expect.arrayContaining([
                expect.objectContaining({ id: "model-selector", currentValue: "opus" }),
              ]));
            });

          ''')
          assert anchor in text, 'test insertion anchor changed unexpectedly'
          if 'uses config replayed during session/load when the load response omits configOptions' not in text:
              text = text.replace(anchor, regression + anchor, 1)
          test.write_text(text)
          PY
      - name: Focused verification
        run: npx vitest run test/acpSessionConfig.test.ts test/claudeAcpRuntime.test.ts
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/pr767-load-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/acp/client.ts test/acpSessionConfig.test.ts .github/workflows/pr767-load-review-repair.yml
          git commit -m "fix: preserve ACP config replay on load"
          git push origin HEAD:feature/763-acp-session-config
