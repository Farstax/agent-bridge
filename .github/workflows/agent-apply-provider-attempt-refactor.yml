name: Apply provider attempt refactor

on:
  push:
    branches:
      - agent/unify-provider-attempt-pipeline

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-provider-attempt-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Apply mechanical refactor
        run: node scripts/apply-provider-attempt-refactor.mjs
      - name: Commit production change
        shell: bash
        run: |
          if git diff --quiet -- src/engine.ts; then
            echo "No production change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts
          git commit -m "refactor: unify BridgeEngine provider attempt execution"
          git push origin HEAD:agent/unify-provider-attempt-pipeline
