name: Issue 461 apply implementation

on:
  pull_request:
    paths:
      - ".github/issue461/**"
      - ".github/workflows/issue-461-source-handoff.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          parts = sorted(Path('.github/issue461').glob('part*.patch'))
          with Path('/tmp/issue461.patch').open('wb') as out:
              for part in parts:
                  data = part.read_bytes()
                  out.write(data)
                  if not data.endswith(b'\n'):
                      out.write(b'\n')
          PY
          git apply --check /tmp/issue461.patch
          git apply /tmp/issue461.patch
          rm -f src/health/suggest.ts src/health/bot.ts src/health/context.ts
          rm -rf .github/issue461
          rm -f .github/workflows/issue-461-source-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: route health investigation through ordinary Run skill"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
