name: Issue 461 apply implementation

on:
  pull_request:
    paths:
      - ".github/issue461/**"
      - ".github/workflows/issue-461-source-handoff.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          parts = sorted(Path('.github/issue461').glob('part*.patch'))
          data = b''.join(part.read_bytes() + (b'' if part.read_bytes().endswith(b'\n') else b'\n') for part in parts)
          text = data.decode()
          old = '''-    const { runCli } = await import("../src/cli.js");
-    try {
-      const mockRunCli = vi.fn().mockResolvedValue(JSON.stringify({ result: "Error: timed out waiting for response" }));'''
          new = '''-    // Mock runCli/parseCliResult behavior by testing with a command that outputs an error/timeout string
-    const { runCli } = await import("../src/cli.js");
-    const originalRunCli = runCli;
-    try {
-      // Mock runCli to return an error string in stdout
-      const mockRunCli = vi.fn().mockResolvedValue(JSON.stringify({ result: "Error: timed out waiting for response" }));'''
          if old not in text:
              raise SystemExit('expected staged patch repair target missing')
          Path('/tmp/issue461.patch').write_text(text.replace(old, new, 1))
          PY
          git apply --check /tmp/issue461.patch
          git apply /tmp/issue461.patch
          rm -f src/health/suggest.ts src/health/bot.ts src/health/context.ts
          rm -rf .github/issue461
          rm -f .github/workflows/issue-461-source-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: route health investigation through ordinary Run skill"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
