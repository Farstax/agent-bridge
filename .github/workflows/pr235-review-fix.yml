name: Apply PR 235 review fix

on:
  push:
    branches: [feat/issue-217-augment-default]
    paths: [.github/workflows/pr235-review-fix.yml]
  pull_request:
    paths: [.github/workflows/pr235-review-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-217-augment-default
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply the reviewed correction
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git apply --index .github/patches/pr235-review-fix.patch
          git rm .github/patches/pr235-review-fix.patch .github/workflows/pr235-review-fix.yml

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused lifecycle tests
        run: npx vitest run test/augmentLifecycleReviewFix.test.ts test/executionLaneCorrectness.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture lint
        run: bash scripts/arch-lint.sh src

      - name: Diff check
        run: git diff --cached --check

      - name: Commit and push the corrected branch
        run: |
          set -Eeuo pipefail
          git commit -m "fix: resolve augment lifecycle review"
          git push origin HEAD:feat/issue-217-augment-default
