name: Platform 467 Exact Head Runner

on:
  push:
    paths:
      - .github/workflows/platform-467-exact-head-runner.yml

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout OSS control repo
        uses: actions/checkout@v4
        with:
          path: control
      - name: Checkout exact Platform head
        uses: actions/checkout@v4
        with:
          repository: nickconstantinou/agent-bridge-platform
          ref: f0578e497cb2ae7c717699489dc465f0991f92c8
          path: platform
      - name: Verify exact Platform head
        run: test "$(git -C platform rev-parse HEAD)" = "f0578e497cb2ae7c717699489dc465f0991f92c8"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Run Platform CI contract and persist result
        shell: bash
        run: |
          set +e
          cd platform
          npm ci --include=dev && \
          npm test && \
          npm run typecheck && \
          AGENT_BRIDGE_SOURCE_POLICY=legacy CONTROL_PLANE_DB_PATH=/tmp/agent-bridge-deploy-check.sqlite npm run deploy:check
          status=$?
          cd ../control
          mkdir -p ci-results
          if [ "$status" -eq 0 ]; then result=PASS; else result=FAIL; fi
          printf '{"platform_head":"%s","result":"%s","runner_commit":"%s"}\n' \
            'f0578e497cb2ae7c717699489dc465f0991f92c8' "$result" "$GITHUB_SHA" \
            > ci-results/platform-467.json
          rm -f .github/workflows/platform-467-exact-head-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Platform #467 exact-head CI result'
          git push
          exit "$status"
