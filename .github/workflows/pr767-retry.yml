name: PR 767 repair retry

on:
  push:
    branches: [feature/763-acp-session-config]

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/763-acp-session-config
          fetch-depth: 0
      - name: Fix runner command and remove retry workflow
        run: |
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/pr767-scoped-repair.yml"); s=p.read_text(); old="run: echo \"$PATCH_SCRIPT_B64\" | base64 -d | python\n"; new="run: echo \"$PATCH_SCRIPT_B64\" | base64 -d | python3\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          rm .github/workflows/pr767-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr767-scoped-repair.yml .github/workflows/pr767-retry.yml
          git commit -m "chore: use python3 for scoped repair"
          git push origin HEAD:feature/763-acp-session-config
