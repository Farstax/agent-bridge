name: Issue 480 stale test migration once

on:
  push:
    branches:
      - feat/issue-480-autonomy-disposition
    paths:
      - .github/workflows/issue-480-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply migration
        run: python3 .github/issue-480-migrate.py
      - name: Install
        run: npm ci
      - name: Focused autonomy tests
        run: npx vitest run test/autonomousGoalRuntime.test.ts test/autonomyDispositionContract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit migrated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomousGoalRuntime.ts test/autonomousGoalRuntime.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: migrate autonomous runtime to disposition actions"
          git push origin HEAD:feat/issue-480-autonomy-disposition
