name: Issue 498 hotfix patch

on:
  push:
    branches:
      - fix/issue-498-autonomy-config-convergence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-498-autonomy-config-convergence
          fetch-depth: 0
      - name: Apply production config convergence fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one patch anchor in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1))

          install = Path("scripts/agent-bridge-install.py")
          replace_once(install, '''def require_fresh_database_targets(
              state_root: Path, services: Sequence[tuple[str, str, tuple[str, ...], str]],
          ) -> None:
              occupied = [str(path) for service in services if (path := database_path(state_root, service)).exists() or path.is_symlink()]
              if occupied:
                  fail(f"persistent database targets already exist; refusing initial installation: {', '.join(occupied)}")
          ''', '''def configured_autonomy_database(
              env: Mapping[str, str],
              state_root: Path,
              services: Sequence[tuple[str, str, tuple[str, ...], str]],
          ) -> Path | None:
              raw = env.get("AGENT_BRIDGE_AUTONOMY_DB_PATH", "").strip()
              if not raw:
                  return None
              if not Path(raw).is_absolute() or any(char.isspace() for char in raw) or os.path.normpath(raw) != raw:
                  fail("AGENT_BRIDGE_AUTONOMY_DB_PATH must be a canonical absolute path without whitespace")
              if not any(service[0] == "agent-bridge-interactive.service" for service in services):
                  fail("AGENT_BRIDGE_AUTONOMY_DB_PATH requires agent-bridge-interactive.service")
              path = Path(raw)
              if path.parent.parent != state_root:
                  fail("AGENT_BRIDGE_AUTONOMY_DB_PATH must live in a direct child of the managed state root")
              primary_paths = {database_path(state_root, service) for service in services}
              if path in primary_paths:
                  fail("AGENT_BRIDGE_AUTONOMY_DB_PATH must not duplicate a primary service database")
              return path


          def require_fresh_database_targets(
              state_root: Path,
              services: Sequence[tuple[str, str, tuple[str, ...], str]],
              env: Mapping[str, str],
          ) -> None:
              targets = [database_path(state_root, service) for service in services]
              autonomy_database = configured_autonomy_database(env, state_root, services)
              if autonomy_database is not None:
                  targets.append(autonomy_database)
              occupied = [str(path) for path in targets if path.exists() or path.is_symlink()]
              if occupied:
                  fail(f"persistent database targets already exist; refusing initial installation: {', '.join(occupied)}")
          ''')

          replace_once(install, '''def bootstrap_databases(
              release: Path,
              node_bin: Path,
              account: pwd.struct_passwd,
              services: Sequence[tuple[str, str, tuple[str, ...], str]],
              databases: Sequence[Path],
          ) -> None:
              """Create schema-valid, provenance-bound databases before services start."""
              if len(services) != len(databases):
                  fail("selected service and database inventories do not match")
              tsx = release / "node_modules/tsx/dist/cli.mjs"
              bootstrap = release / "scripts/rollout-db.ts"
              if any(path.is_symlink() or not path.is_file() for path in (tsx, bootstrap)):
                  fail("release is missing database bootstrap runtime")
              for service, database in zip(services, databases):
                  role = DATABASE_ROLES.get(service[3])
                  if role is None:
                      fail(f"unknown database role for service state: {service[3]}")
                  subprocess.run([
                      "/usr/sbin/runuser", "--user", account.pw_name, "--", str(node_bin),
                      str(tsx), str(bootstrap), "bootstrap", "--db", str(database), "--role", role,
                      "--confirm-new-role", str(database),
                  ], check=True, capture_output=True, text=True)
          ''', '''def bootstrap_databases(
              release: Path,
              node_bin: Path,
              account: pwd.struct_passwd,
              services: Sequence[tuple[str, str, tuple[str, ...], str]],
              databases: Sequence[Path],
          ) -> None:
              """Create schema-valid, provenance-bound databases before services start."""
              if len(databases) not in {len(services), len(services) + 1}:
                  fail("selected service and database inventories do not match")
              tsx = release / "node_modules/tsx/dist/cli.mjs"
              bootstrap = release / "scripts/rollout-db.ts"
              if any(path.is_symlink() or not path.is_file() for path in (tsx, bootstrap)):
                  fail("release is missing database bootstrap runtime")

              def bootstrap_database(database: Path, role: str) -> None:
                  subprocess.run([
                      "/usr/sbin/runuser", "--user", account.pw_name, "--", str(node_bin),
                      str(tsx), str(bootstrap), "bootstrap", "--db", str(database), "--role", role,
                      "--confirm-new-role", str(database),
                  ], check=True, capture_output=True, text=True)

              for service, database in zip(services, databases[:len(services)]):
                  role = DATABASE_ROLES.get(service[3])
                  if role is None:
                      fail(f"unknown database role for service state: {service[3]}")
                  bootstrap_database(database, role)
              if len(databases) == len(services) + 1:
                  if not any(service[0] == "agent-bridge-interactive.service" for service in services):
                      fail("secondary autonomy database requires agent-bridge-interactive.service")
                  bootstrap_database(databases[-1], "interactive")
          ''')

          replace_once(install, '''        units.append(unit)
                  databases.append(db_path)

              for name in (CLEANUP_SERVICE, CLEANUP_TIMER):
          ''', '''        units.append(unit)
                  databases.append(db_path)

              autonomy_database = configured_autonomy_database(env, state_root, selected)
              if autonomy_database is not None:
                  if state_root.is_symlink() or not state_root.is_dir() or state_root.resolve() != state_root:
                      fail("managed state root must be a canonical non-symlink directory for autonomy database provisioning")
                  autonomy_parent = autonomy_database.parent
                  autonomy_parent.mkdir(mode=0o750, exist_ok=True)
                  if autonomy_parent.is_symlink() or not autonomy_parent.is_dir() or autonomy_parent.resolve() != autonomy_parent:
                      fail("autonomy database parent must be a canonical non-symlink directory")
                  os.chown(autonomy_parent, account.pw_uid, account.pw_gid)
                  os.chmod(autonomy_parent, 0o750)
                  databases.append(autonomy_database)

              for name in (CLEANUP_SERVICE, CLEANUP_TIMER):
          ''')

          replace_once(install,
              '    require_fresh_database_targets(state_root, selected)\n',
              '    require_fresh_database_targets(state_root, selected, os.environ)\n',
          )

          rollout = Path("scripts/rollout-agent-bridge.sh")
          replace_once(rollout,
              '/usr/bin/mkdir /usr/bin/chmod /usr/bin/dirname',
              '/usr/bin/mkdir /usr/bin/chmod /usr/bin/chown /usr/bin/dirname',
          )

          convergence = r'''read_convergence_env_key() {
            local file="$1" target_key="$2" value="$3" required="$4" line mode owner expected_owner
            if [[ ! -e "$file" && ! -L "$file" ]]; then
              [[ "$required" == "0" ]] || die "required EnvironmentFile is missing during autonomy config convergence: $file"
              convergence_env_value="$value"
              return 0
            fi
            [[ -f "$file" && ! -L "$file" ]] || die "unsafe EnvironmentFile during autonomy config convergence: $file"
            [[ "$(/usr/bin/realpath -e "$file")" == "$file" ]] || die "non-canonical EnvironmentFile during autonomy config convergence: $file"
            expected_owner="$EUID"
            (( test_mode == 0 )) && expected_owner=0
            owner="$(/usr/bin/stat -c %u "$file")"
            [[ "$owner" == "$expected_owner" ]] || die "unsafe EnvironmentFile ownership during autonomy config convergence: $file"
            mode="$(/usr/bin/stat -c %a "$file")"
            (( (8#$mode & 022) == 0 )) || die "writable EnvironmentFile during autonomy config convergence: $file"
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
              if [[ "$line" == "$target_key="* ]]; then
                value="${line#*=}"
                [[ -n "$value" && "$value" != *[[:space:]]* ]] || die "unsupported or empty $target_key in $file"
                [[ "$value" != *\"* && "$value" != *"'"* && "$value" != *\\* && "$value" != *'$'* ]] || die "unsupported $target_key in $file"
              fi
            done < "$file"
            convergence_env_value="$value"
          }

          converge_deployer_autonomy_config() {
            [[ "$deployer_mode" == "1" ]] || return 0
            local autonomy_unit="agent-bridge-interactive.service" unit selected=0
            for unit in "${units[@]}"; do
              [[ "$unit" == "$autonomy_unit" ]] && selected=1
            done
            (( selected == 1 )) || return 0

            local shared_env="$defaults_dir/agent-bridge-shared"
            local release_env="$defaults_dir/agent-bridge-release"
            local unit_env="$defaults_dir/agent-bridge-interactive"
            local expected_environment_files actual_environment_files explicit_environment
            expected_environment_files="$shared_env (ignore_errors=yes)"$'\n'"$release_env (ignore_errors=no)"$'\n'"$unit_env (ignore_errors=no)"
            actual_environment_files="$("$systemctl_cmd" show "$autonomy_unit" --property=EnvironmentFiles --value)"
            [[ "$actual_environment_files" == "$expected_environment_files" ]] || die "effective EnvironmentFiles mismatch for $autonomy_unit during autonomy config convergence"
            explicit_environment="$("$systemctl_cmd" show "$autonomy_unit" --property=Environment --value)"
            [[ " $explicit_environment " != *" AGENT_BRIDGE_AUTONOMY_DB_PATH="* ]] || die "explicit systemd AGENT_BRIDGE_AUTONOMY_DB_PATH override is unsupported for $autonomy_unit"
            [[ " $explicit_environment " != *" DB_PATH="* ]] || die "explicit systemd DB_PATH override is unsupported for $autonomy_unit"

            convergence_env_value=""
            read_convergence_env_key "$shared_env" AGENT_BRIDGE_AUTONOMY_DB_PATH "" 0
            read_convergence_env_key "$release_env" AGENT_BRIDGE_AUTONOMY_DB_PATH "$convergence_env_value" 1
            local autonomy_inherited="$convergence_env_value"
            read_convergence_env_key "$unit_env" AGENT_BRIDGE_AUTONOMY_DB_PATH "$autonomy_inherited" 1
            local autonomy_database="$convergence_env_value"
            [[ -n "$autonomy_database" ]] || return 0

            convergence_env_value=""
            read_convergence_env_key "$shared_env" DB_PATH "" 0
            read_convergence_env_key "$release_env" DB_PATH "$convergence_env_value" 1
            local db_inherited="$convergence_env_value"
            read_convergence_env_key "$unit_env" DB_PATH "$db_inherited" 1
            local primary_database="$convergence_env_value"
            [[ "$primary_database" == /* && "$autonomy_database" == /* ]] || die "autonomy convergence database paths must be absolute"
            [[ "$(/usr/bin/realpath -m -- "$primary_database")" == "$primary_database" ]] || die "interactive primary database path is not canonical during autonomy config convergence"
            [[ "$(/usr/bin/realpath -m -- "$autonomy_database")" == "$autonomy_database" ]] || die "autonomy database path is not canonical during autonomy config convergence"
            [[ -f "$primary_database" && ! -L "$primary_database" ]] || die "interactive primary database is missing or symlinked during autonomy config convergence"
            [[ "$autonomy_database" != "$primary_database" ]] || die "autonomy database duplicates the interactive primary database"

            local primary_parent managed_state_root autonomy_parent
            primary_parent="$(/usr/bin/dirname -- "$primary_database")"
            managed_state_root="$(/usr/bin/dirname -- "$primary_parent")"
            autonomy_parent="$(/usr/bin/dirname -- "$autonomy_database")"
            [[ "$(/usr/bin/dirname -- "$autonomy_parent")" == "$managed_state_root" ]] || die "autonomy database must live in a sibling managed state directory"
            [[ -d "$managed_state_root" && ! -L "$managed_state_root" && "$(/usr/bin/realpath -e "$managed_state_root")" == "$managed_state_root" ]] || die "managed state root is unsafe during autonomy config convergence"

            if [[ ! -e "$autonomy_parent" && ! -L "$autonomy_parent" ]]; then
              /usr/bin/mkdir --mode=0750 -- "$autonomy_parent"
              if (( test_mode == 0 )); then
                local runtime_uid runtime_gid
                runtime_uid="$(/usr/bin/id -u "$runtime_user")"
                runtime_gid="$(/usr/bin/id -g "$runtime_user")"
                /usr/bin/chown "$runtime_uid:$runtime_gid" "$autonomy_parent"
              fi
            fi
            [[ -d "$autonomy_parent" && ! -L "$autonomy_parent" && "$(/usr/bin/realpath -e "$autonomy_parent")" == "$autonomy_parent" ]] || die "autonomy database parent is missing or unsafe during config convergence"
            local parent_mode
            parent_mode="$(/usr/bin/stat -c %a "$autonomy_parent")"
            (( (8#$parent_mode & 022) == 0 )) || die "autonomy database parent must not be group/world writable"
            if (( test_mode == 0 )); then
              [[ "$(/usr/bin/stat -c %u "$autonomy_parent")" == "$(/usr/bin/id -u "$runtime_user")" ]] || die "autonomy database parent must be owned by the runtime user"
            fi

            local database already_configured=0
            for database in "${databases[@]}"; do
              [[ "$database" == "$autonomy_database" ]] && already_configured=1
            done
            if (( already_configured == 0 )); then
              local config_dir config_tmp config_current_mode
              config_dir="$(/usr/bin/dirname -- "$config_file")"
              config_tmp="$(/usr/bin/mktemp --tmpdir="$config_dir" .rollout.conf.autonomy.XXXXXX)"
              /usr/bin/cat "$config_file" > "$config_tmp"
              printf '\ndatabase=%s\n' "$autonomy_database" >> "$config_tmp"
              config_current_mode="$(/usr/bin/stat -c %a "$config_file")"
              /usr/bin/chmod "$config_current_mode" "$config_tmp"
              /usr/bin/mv -T -- "$config_tmp" "$config_file"
              databases+=("$autonomy_database")
              echo "converged configured autonomy database into fixed rollout inventory path=$autonomy_database"
            fi
          }

          converge_deployer_autonomy_config
          '''
          anchor = 'if (( test_mode == 0 )); then /usr/bin/id -u "$runtime_user" >/dev/null || die "runtime user does not exist"; fi\nrollout_config_sha256="$(/usr/bin/sha256sum "$config_file" | /usr/bin/cut -d\' \' -f1)"\n'
          replacement = 'if (( test_mode == 0 )); then /usr/bin/id -u "$runtime_user" >/dev/null || die "runtime user does not exist"; fi\n' + convergence + 'rollout_config_sha256="$(/usr/bin/sha256sum "$config_file" | /usr/bin/cut -d\' \' -f1)"\n'
          replace_once(rollout, anchor, replacement)
          PY
      - name: Syntax check
        run: |
          python3 -m py_compile scripts/agent-bridge-install.py
          bash -n scripts/rollout-agent-bridge.sh
      - name: Commit patch and remove scaffolding
        shell: bash
        run: |
          rm -f .github/workflows/issue-498-hotfix-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/agent-bridge-install.py scripts/rollout-agent-bridge.sh .github/workflows/issue-498-hotfix-patch.yml
          git commit -m "fix: converge autonomy database production inventory"
          git push origin HEAD:fix/issue-498-autonomy-config-convergence
