name: Release Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to bind into a publishable artifact, for example release-2026.09.07-1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Qualify and build immutable release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify the exact event head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        env:
          EXPECTED_SHA: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository qualification gate
        run: npm run qualify:local
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"

      - name: Compile runtime
        run: npm run build

      - name: Retain production dependencies only
        run: npm prune --omit=dev

      - name: Assemble and hash release artifact
        id: artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          builder_head="${{ github.sha }}"
          database_schema_version="$(node --input-type=module -e 'import("./dist/db/schema.js").then((m) => console.log(m.CURRENT_SCHEMA_VERSION))')"
          root="$RUNNER_TEMP/agent-bridge-release"
          archive="$RUNNER_TEMP/agent-bridge-${commit}.tar.gz"
          checks_json='["test","typecheck","architecture-lint","compile","manifest"]'
          mkdir -p "$root"
          cp -a dist src package.json package-lock.json node_modules "$root/"
          mkdir -p "$root/scripts" "$root/bin" "$root/skills"
          cp -a scripts/rollout-db.ts scripts/rollout-db-impl.ts scripts/upgrade.sh scripts/provider-qualification.ts scripts/agent-bridge-context.ts scripts/agent-bridge-advisor.ts scripts/agent-bridge-routines.ts scripts/agent-bridge-sensors.ts scripts/agent-bridge-inspect.ts scripts/skill-manager.ts scripts/autonomous-goal-operator.ts scripts/release-stage.py scripts/rollout-restore.py "$root/scripts/"
          cp -a scripts/agent-bridge-install.py scripts/agent-bridge-deploy.py scripts/rollout-agent-bridge.sh scripts/release-activate.py scripts/rollout-authorization.py scripts/rollout-acceptance.py scripts/install-voice-stt.sh scripts/install-agy-acp.sh "$root/scripts/"
          cp -a scripts/reap-tmp-artifacts.sh "$root/scripts/"
          test -f "$root/scripts/autonomous-goal-operator.ts"
          test -f "$root/scripts/agent-bridge-routines.ts"
          test -f "$root/scripts/agent-bridge-sensors.ts"
          test -f "$root/scripts/agent-bridge-inspect.ts"
          test -f "$root/scripts/install-voice-stt.sh"
          test -f "$root/scripts/install-agy-acp.sh"
          mkdir -p "$root/systemd"
          cp -a systemd/agent-bridge-antigravity.service systemd/agent-bridge-claude.service systemd/agent-bridge-codex.service systemd/agent-bridge-discord-interactive.service systemd/agent-bridge-interactive.service "$root/systemd/"
          cp -a systemd/agent-bridge-tmp-cleanup.service systemd/agent-bridge-tmp-cleanup.timer "$root/systemd/"
          cp -a bin/agent-bridge-context bin/agent-bridge-advisor bin/agent-bridge-routines bin/agent-bridge-sensors bin/agent-bridge-inspect "$root/bin/"
          chmod 0755 "$root/bin/agent-bridge-sensors"
          test -f "$root/bin/agent-bridge-routines"
          test -f "$root/bin/agent-bridge-sensors"
          test -f "$root/bin/agent-bridge-inspect"
          cp -a skills/. "$root/skills/"
          cp -a tsconfig.json "$root/"
          cat > "$root/qualification-evidence.json" <<EOF
          {
            "commit": "${commit}",
            "tree": "${tree}",
            "workflow_run": "${GITHUB_RUN_ID}",
            "workflow_head": "${builder_head}",
            "checks": ${checks_json}
          }
          EOF
          release_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/stampReleaseVersion.mjs --root "$root" --release-tag "$RELEASE_TAG"
            release_args=(--release-tag "$RELEASE_TAG")
          fi
          node scripts/releaseManifest.mjs \
            --root "$root" \
            --output "$root/manifest.json" \
            --commit "$commit" \
            --tree "$tree" \
            --node-version "$(node --version)" \
            --platform "$(node -p 'process.platform')" \
            --arch "$(node -p 'process.arch')" \
            --builder-commit "$commit" \
            --builder-workflow-run "$GITHUB_RUN_ID" \
            --builder-workflow-head "$builder_head" \
            --database-schema-version "$database_schema_version" \
            "${release_args[@]}"
          node --input-type=module - "$root/manifest.json" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const manifestPath = process.argv[2];
          const root = manifestPath.slice(0, -"manifest.json".length);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          for (const component of manifest.host_components ?? []) {
            const file = manifest.files.find((entry) => entry.path === component.installer);
            if (!file || file.type === "symlink") throw new Error(`${component.id} installer is not manifest-bound as a regular file`);
            const digest = createHash("sha256").update(readFileSync(`${root}${component.installer}`)).digest("hex");
            if (file.sha256 !== digest) throw new Error(`${component.id} installer manifest hash mismatch`);
          }
          NODE
          tar --create --gzip --file "$archive" \
            --directory "$root" --sort=name --owner=0 --group=0 --numeric-owner .
          verify_root="$RUNNER_TEMP/agent-bridge-release-verify"
          mkdir -p "$verify_root"
          tar -xzf "$archive" -C "$verify_root"
          test -f "$verify_root/scripts/install-voice-stt.sh"
          test -f "$verify_root/scripts/install-agy-acp.sh"
          node --input-type=module - "$verify_root/manifest.json" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const manifestPath = process.argv[2];
          const root = manifestPath.slice(0, -"manifest.json".length);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          for (const component of manifest.host_components ?? []) {
            const file = manifest.files.find((entry) => entry.path === component.installer);
            if (!file || file.type === "symlink") throw new Error(`archived ${component.id} host-component contract is missing`);
            const digest = createHash("sha256").update(readFileSync(`${root}${component.installer}`)).digest("hex");
            if (file.sha256 !== digest) throw new Error(`archived ${component.id} installer is not hash-bound`);
          }
          NODE
          ( cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" ) | tee "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload qualified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ steps.artifact.outputs.archive }}
            ${{ steps.artifact.outputs.archive }}.sha256