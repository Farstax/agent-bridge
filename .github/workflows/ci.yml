name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the exact event head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          # vitest.config.ts caps the forks pool to maxForks: 1 (serial),
          # removing concurrent-process memory competition. 8192MB was not
          # enough for a branch with a larger test suite (PR #330's durable
          # continuation work): the single process grew to exactly that
          # ceiling and OOM'd, confirming genuine (not concurrency-driven)
          # memory need above 8GB for a bigger suite. Raise toward the
          # runner's actual ceiling, leaving headroom for the OS/coordinator.
          NODE_OPTIONS: "--max-old-space-size=14336"

      - run: npm run typecheck
