name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the exact event head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          # vitest.config.ts already runs the forks pool serial
          # (maxForks: 1) to remove concurrent-process memory competition.
          # That alone was not enough: the suite's cumulative memory
          # growth across ~2500 tests in one process still exceeds V8's
          # default ~4GB old-space ceiling and OOM-crashes the worker
          # (observed directly on this runner, not reproducible locally).
          # Raise the ceiling for this single process explicitly.
          NODE_OPTIONS: "--max-old-space-size=8192"

      - run: npm run typecheck
