name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the exact event head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Synchronize package lock
        id: sync_lock
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: sync Claude ACP package lock"
          git push origin "HEAD:${HEAD_REF}"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - run: npm ci
        if: steps.sync_lock.outputs.updated != 'true'

      - name: Run repository qualification gate
        if: steps.sync_lock.outputs.updated != 'true'
        run: npm run qualify:local
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"

# Temporary lock synchronization only; restore before final qualification.
