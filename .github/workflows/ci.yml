name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-480-migration-artifact:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 487
    name: Issue 480 migration artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Apply migration in workspace only
        run: python3 .github/issue-480-migrate.py
      - name: Upload migrated files
        uses: actions/upload-artifact@v4
        with:
          name: issue-480-migrated-files
          path: |
            src/autonomousGoalRuntime.ts
            test/autonomousGoalRuntime.test.ts

  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the exact event head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"

      - run: npm run typecheck
