name: Issue 545 cleanup

on:
  push:
    branches:
      - fix/545-unify-provider-execution

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/545-unify-provider-execution
          fetch-depth: 0
      - name: Apply review cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("test/engine.test.ts")
          text = path.read_text()

          text = text.replace(
              '    it.each(["sync", "async"] as const)("streams only agent responses through the %s capacity fallback", async (mode) => {',
              '    it("streams only agent responses through the canonical capacity fallback", async () => {',
          )
          text = text.replace('        return mode === "async" ? { text: fallbackOutput } : fallbackOutput;', '        return { text: fallbackOutput };')
          text = text.replace(
              '        mode === "async" ? { runCliAsync: providerRun as any } : { runCli: providerRun as any },',
              '        { runCliAsync: providerRun as any },',
          )
          text = text.replace('      await engine.handleMessages([makeMessage(`capacity fallback ${mode}`)]);', '      await engine.handleMessages([makeMessage("capacity fallback")]);')

          text = text.replace(
              '    it.each(["sync", "async"] as const)("commits a recoverable Agy fresh-session retry exactly once in %s mode", async (mode) => {',
              '    it("commits a recoverable Agy fresh-session retry exactly once", async () => {',
          )
          text = text.replace('JSON.stringify([{ type: "decision", scope: "project", text: `Agy ${mode} recovery commits one memory candidate.`, confidence: 0.9 }]),', 'JSON.stringify([{ type: "decision", scope: "project", text: "Agy recovery commits one memory candidate.", confidence: 0.9 }]),')
          text = text.replace(
              '        mode === "async"\n          ? { runCliAsync: async (...args: any[]) => ({ text: await execute(...args) }) }\n          : { runCli: execute },',
              '        { runCliAsync: async (...args: any[]) => ({ text: await execute(...args) }) },',
          )

          text = text.replace('executionMode: "safe",  pollIntervalMs', 'executionMode: "safe", pollIntervalMs')
          text = text.replace('busyMessageMode: "queue",  pollIntervalMs', 'busyMessageMode: "queue", pollIntervalMs')
          text = text.replace('executionMode: "safe",\n\n', 'executionMode: "safe",\n')

          path.write_text(text)
          PY
          git diff --check
          ! grep -nE 'it\.each\(\["sync", "async"\]|asyncEnabled|BRIDGE_ASYNC_ENABLED' test/engine.test.ts
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npx vitest run test/engine.test.ts test/providerAttemptPipelineOwnership.test.ts test/execution-paths.test.ts test/executionLaneCorrectness.test.ts test/crossEngineQueueRecovery.test.ts test/arch/executionTopologyLint.test.ts
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/engine.test.ts
          git commit -m "test: remove retired execution-mode fixtures (#545)"
          git push origin HEAD:fix/545-unify-provider-execution
