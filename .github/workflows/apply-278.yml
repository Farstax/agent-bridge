name: Apply OSS 278 TDD patch

on:
  push:
    branches:
      - fix/278-canonical-chat-key

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/278-canonical-chat-key
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add RED regressions
        run: python3 scripts/apply-canonical-chat-key.py tests
      - name: Prove RED
        shell: bash
        run: |
          set +e
          npx vitest run test/canonicalConversationIdentity.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected canonical conversation regressions to fail before implementation"
            exit 1
          fi
          echo "RED observed as expected"
      - name: Apply implementation
        run: python3 scripts/apply-canonical-chat-key.py implementation
      - name: Focused validation
        run: npx vitest run test/canonicalConversationIdentity.test.ts test/eventStore.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Diff check
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm -f scripts/apply-canonical-chat-key.py .github/workflows/apply-278.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use canonical surface chat keys"
          git push origin HEAD:fix/278-canonical-chat-key
