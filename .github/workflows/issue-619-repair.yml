name: Issue 619 repair

on:
  push:
    branches:
      - fix/619-lossless-queued-identities

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Apply repair
        run: python3 scripts/issue-619-repair.py
      - name: Focused regression tests
        run: npx vitest run test/claimedInteractiveFallback.test.ts test/pendingMessageIdentityMigration.test.ts test/crossEngineQueueRecovery.test.ts
      - name: Qualify
        run: npm run qualify:local
      - name: Commit repaired source without scaffolding
        run: |
          rm scripts/issue-619-repair.py .github/workflows/issue-619-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/interactiveBot.ts src/db/schema.ts src/db/pendingMessageIdentityMigration.ts test/claimedInteractiveFallback.test.ts test/pendingMessageIdentityMigration.test.ts scripts/issue-619-repair.py .github/workflows/issue-619-repair.yml
          git diff --cached --check
          git commit -m 'fix: preserve queued identities across recovery (#619)'
          git push
