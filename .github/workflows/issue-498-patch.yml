name: Apply issue 498 fix
on:
  push:
    branches: [fix/issue-498-autonomy-db-rollout]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply guarded rollout fix and regression
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          discovery_anchor = '''done

declare -A canonical_databases=()
'''
          discovery_block = '''done

# The interactive service may own a second production database for autonomy.
# Resolve it from the same validated EnvironmentFile chain as its primary DB.
autonomy_database=""
autonomy_database_missing=0
autonomy_unit="agent-bridge-interactive.service"
if [[ -n "${selected_units[$autonomy_unit]:-}" ]]; then
  autonomy_env="$defaults_dir/${autonomy_unit%.service}"
  autonomy_key=AGENT_BRIDGE_AUTONOMY_DB_PATH
  autonomy_explicit_environment="$("$systemctl_cmd" show "$autonomy_unit" --property=Environment --value)"
  [[ " $autonomy_explicit_environment " != *" $autonomy_key="* ]] || die "explicit systemd $autonomy_key override is unsupported for $autonomy_unit"
  resolved_env_value=""
  read_env_key "$shared_env" "$autonomy_key" ""
  read_env_key "$release_env" "$autonomy_key" "$resolved_env_value"
  autonomy_inherited_value="$resolved_env_value"
  read_env_key "$autonomy_env" "$autonomy_key" "$autonomy_inherited_value"
  autonomy_candidate="$resolved_env_value"
  if [[ -n "$autonomy_candidate" ]]; then
    [[ "$autonomy_candidate" == /* && "$autonomy_candidate" != *[[:space:]]* ]] || die "$autonomy_unit would use an invalid $autonomy_key"
    if [[ -e "$autonomy_candidate" || -L "$autonomy_candidate" ]]; then
      [[ -f "$autonomy_candidate" && ! -L "$autonomy_candidate" ]] || die "autonomy database target is occupied by a non-regular path: $autonomy_candidate"
      autonomy_database="$(/usr/bin/realpath -e "$autonomy_candidate")"
      [[ "$autonomy_database" == "$autonomy_candidate" ]] || die "autonomy database path is not canonical: $autonomy_candidate"
      [[ -z "${discovered_databases[$autonomy_database]:-}" ]] || die "autonomy database duplicates another managed database: $autonomy_database"
      discovered_databases[$autonomy_database]=1
      databases+=("$autonomy_database")
    else
      autonomy_database="$autonomy_candidate"
      autonomy_database_missing=1
    fi
  fi
fi

declare -A canonical_databases=()
'''
          replace_once("scripts/rollout-agent-bridge.sh", discovery_anchor, discovery_block)

          db_args_anchor = '''  for unit in "${!unit_databases[@]}"; do db_args+=(--database-role "${unit_databases[$unit]}=${unit_roles[$unit]}"); done
}
'''
          db_args_block = '''  for unit in "${!unit_databases[@]}"; do db_args+=(--database-role "${unit_databases[$unit]}=${unit_roles[$unit]}"); done
  if [[ -n "$autonomy_database" && "$autonomy_database_missing" == 0 ]]; then
    db_args+=(--resolving-unit "$autonomy_database=$autonomy_unit")
    db_args+=(--database-role "$autonomy_database=interactive")
  fi
}
'''
          replace_once("scripts/rollout-agent-bridge.sh", db_args_anchor, db_args_block)

          contained_anchor = '''record_phase CONTAINED

code_check
run_db_tool inspect --evidence - "${db_args[@]}" > "$artifact_dir/stopped-evidence.json"
'''
          contained_block = '''record_phase CONTAINED

code_check
if (( autonomy_database_missing == 1 )); then
  echo "bootstrapping configured autonomy database before release activation path=$autonomy_database"
  run_db_tool bootstrap --db "$autonomy_database" --role interactive --confirm-new-role "$autonomy_database" --evidence "$artifact_dir/autonomy-bootstrap-evidence.json"
  hash_evidence_file "$artifact_dir/autonomy-bootstrap-evidence.json"
  [[ -f "$autonomy_database" && ! -L "$autonomy_database" ]] || die "autonomy database bootstrap did not create a regular database: $autonomy_database"
  autonomy_canonical="$(/usr/bin/realpath -e "$autonomy_database")"
  [[ "$autonomy_canonical" == "$autonomy_database" ]] || die "bootstrapped autonomy database path is not canonical: $autonomy_database"
  databases+=("$autonomy_database")
  autonomy_database_missing=0
  build_db_args
  # Refresh before-state evidence with the complete inventory while services
  # are contained and before any schema migration or release activation.
  run_db_tool inspect --evidence - "${db_args[@]}" > "$artifact_dir/preflight-evidence.json"
  hash_evidence_file "$artifact_dir/preflight-evidence.json"
fi
run_db_tool inspect --evidence - "${db_args[@]}" > "$artifact_dir/stopped-evidence.json"
'''
          replace_once("scripts/rollout-agent-bridge.sh", contained_anchor, contained_block)

          test_anchor = '''describe("guarded rollout helper", () => {
'''
          test_block = '''describe("guarded rollout helper", () => {
  it("provisions a configured fresh autonomy database before release activation", () => {
    const fixture = createFixture();
    const { currentPointer } = prepareImmutableRelease(fixture, fixture.previousCommit);
    const autonomyPath = join(fixture.root, "databases", "company-autonomy", "bridge.sqlite");
    writeFileSync(
      join(fixture.envDir, "agent-bridge-interactive"),
      `DB_PATH=${fixture.dbPaths[3]}\\nAGENT_BRIDGE_AUTONOMY_DB_PATH=${autonomyPath}\\n`,
      { mode: 0o600 },
    );
    const authorization = writeAuthorization(fixture);

    const result = runAuthorizedRollout(fixture, authorization);

    expect(result.status, `${result.stdout}\\n${result.stderr}`).toBe(0);
    expect(existsSync(autonomyPath)).toBe(true);
    const autonomyDb = new Database(autonomyPath, { readonly: true, fileMustExist: true });
    expect(Number(autonomyDb.pragma("user_version", { simple: true }))).toBe(CURRENT_SCHEMA_VERSION);
    autonomyDb.close();
    const bootstrapIndex = result.stdout.indexOf("bootstrapping configured autonomy database before release activation");
    const activationIndex = result.stdout.indexOf("activating immutable release");
    expect(bootstrapIndex).toBeGreaterThanOrEqual(0);
    expect(activationIndex).toBeGreaterThan(bootstrapIndex);
    expect(readlinkSync(currentPointer)).toBe(fixture.expectedCommit);
  });
'''
          replace_once("test/rolloutHelper.test.ts", test_anchor, test_block)
      - run: npm test -- --run test/rolloutHelper.test.ts
      - run: npm run typecheck
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-498-patch.yml
          git add scripts/rollout-agent-bridge.sh test/rolloutHelper.test.ts
          git commit -m "Fix autonomy database rollout provisioning (#498)"
          git push origin HEAD:fix/issue-498-autonomy-db-rollout
