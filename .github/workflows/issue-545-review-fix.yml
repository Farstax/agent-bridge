name: Issue 545 review fix

on:
  push:
    branches:
      - fix/545-unify-provider-execution
    paths:
      - .github/workflows/issue-545-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/545-unify-provider-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply scoped timeout propagation fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/messageDelivery.ts",
              "  propagateExecutionErrors = false,\n  runId,",
              "  propagateExecutionErrors = false,\n  propagateTimeoutErrors = false,\n  runId,",
          )
          replace_once(
              "src/messageDelivery.ts",
              "  propagateExecutionErrors?: boolean;\n  runId?: string;",
              "  propagateExecutionErrors?: boolean;\n  propagateTimeoutErrors?: boolean;\n  runId?: string;",
          )
          replace_once(
              "src/messageDelivery.ts",
              "    if (err instanceof CliTimeoutError) throw err;",
              "    if (propagateTimeoutErrors && err instanceof CliTimeoutError) throw err;",
          )
          replace_once(
              "src/engine.ts",
              "        propagateExecutionErrors: false,\n        runId: input.runId,",
              "        propagateExecutionErrors: false,\n        propagateTimeoutErrors: true,\n        runId: input.runId,",
          )
          replace_once(
              "test/engine.test.ts",
              '    it("streams the same safe Claude preview on the synchronous Telegram path", async () => {',
              '    it("streams the same safe Claude preview through the runCli compatibility adapter", async () => {',
          )
          PY
          git diff --check
      - name: Validate focused behavior
        run: |
          npm ci
          npm run typecheck
          npx vitest run test/executionLaneCorrectness.test.ts test/engine.test.ts test/providerAttemptPipelineOwnership.test.ts test/execution-paths.test.ts test/crossEngineQueueRecovery.test.ts test/arch/executionTopologyLint.test.ts
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/messageDelivery.ts src/engine.ts test/engine.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: scope timeout propagation to engine lifecycle (#545)"
          git push origin HEAD:fix/545-unify-provider-execution
