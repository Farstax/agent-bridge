name: Issue 605 qualification

on:
  push:
    branches: [ship/605-surface-neutral-ingress]

permissions:
  contents: read

concurrency:
  group: issue-605-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run qualify:local
        env:
          NODE_OPTIONS: --max-old-space-size=3072
