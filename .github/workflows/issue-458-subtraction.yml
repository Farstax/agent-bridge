name: Issue 458 subtraction transform

on:
  push:
    branches:
      - agent/issue-458-advisor-skill

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-458-advisor-skill
          fetch-depth: 0
      - name: Apply bounded Advisor subtraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, got {n}")
              return out

          engine = Path("src/engine.ts")
          s = engine.read_text()
          for line in [
              'import { parseAdvisorConfig } from "./advisorConfig.js";\n',
              'import { formatAdvisorResult } from "./advisor.js";\n',
              'import { AdvisorService } from "./advisorService.js";\n',
              'import type { AdvisorRequestMode, AdvisorResult } from "./advisorTypes.js";\n',
          ]:
              if line not in s: raise SystemExit(f"engine import missing: {line.strip()}")
              s = s.replace(line, "", 1)
          s = sub1(s, r'\nfunction advisorModeForPrompt\([\s\S]*?\nfunction createTypingTracker', '\nfunction createTypingTracker', 'engine advisor helpers')
          s = sub1(s, r'\n  private readonly advisorSuggestions = new Map<string, \{[\s\S]*?\n  \}>\(\);', '', 'engine advisor suggestion state')
          s = sub1(s, r'\n          if \(commandResponse\.kind === "advisor"\) \{[\s\S]*?\n          \}\n          if \(commandResponse\.kind === "btw"\)', '\n          if (commandResponse.kind === "btw")', 'engine direct advisor command')
          s = sub1(s, r'    const advisorConfig = parseAdvisorConfig\(\);[\s\S]*?    let executionOutcome: ExecutionOutcome = "failed";', '    const executionPrompt = prompt!;\n    let executionOutcome: ExecutionOutcome = "failed";', 'engine auto/suggest advisor path')
          s = sub1(s, r'\n  private _requestAdvisor\([\s\S]*?\n  private async _executeBtw', '\n  private async _executeBtw', 'engine advisor request helper')
          s = sub1(s, r'\n  private _advisorService\(\): AdvisorService \{[\s\S]*?\n  \}\n\n  private async _executeAndSend', '\n  private async _executeAndSend', 'engine advisor service helper')
          s = sub1(s, r'    if \(action === "advisor_suggest" && targetKind === this\.kind\) \{[\s\S]*?\n    \}\n    if \(action === "queue_mode"\)', '    if (action === "queue_mode")', 'engine advisor callback path')
          s = sub1(s, r'    const advisorPrompt = advisorCapability \? \[[\s\S]*?\n    \]\.join\("\\n"\) : "";\n', '', 'engine advisor prompt advertisement')
          if 'prompt: `${contextPrompt}${advisorPrompt}`,' not in s: raise SystemExit('engine advisor prompt join missing')
          s = s.replace('prompt: `${contextPrompt}${advisorPrompt}`,', 'prompt: contextPrompt,', 1)
          if 'this._rememberTurn(chatKey, promptForMemory(prompt), result.text)' not in s: raise SystemExit('engine promptForMemory call missing')
          s = s.replace('this._rememberTurn(chatKey, promptForMemory(prompt), result.text)', 'this._rememberTurn(chatKey, prompt, result.text)', 1)
          if '          activeModel: this.db.getSetting(this.kind) || this.opts.botConfig.modelPreference[0] || null,\n' in s:
              s = s.replace('          activeModel: this.db.getSetting(this.kind) || this.opts.botConfig.modelPreference[0] || null,\n', '', 1)
          engine.write_text(s)

          commands = Path("src/commands.ts")
          s = commands.read_text()
          for line in [
              'import { parseAdvisorConfig } from "./advisorConfig.js";\n',
              'import { inspectAdvisorConfigSources } from "./advisorConfigSource.js";\n',
              '  | { kind: "advisor"; action: "ask" | "review" | "plan" | "debug"; task: string; chatKey: string }\n',
          ]:
              if line not in s: raise SystemExit(f"commands legacy line missing: {line.strip()}")
              s = s.replace(line, "", 1)
          if '"/context", "/advisor", "/btw"' not in s: raise SystemExit('commands advisor built-in set missing')
          s = s.replace('"/context", "/advisor", "/btw"', '"/context", "/btw"', 1)
          s = sub1(s, r'\n  if \(text === "/advisor"\) \{[\s\S]*?\n  \}\n\n  if \(text === "/btw"\)', '\n  if (text === "/btw")', 'commands direct advisor route')
          line = '    { command: "advisor",  description: "Ask frontier advisor" },\n'
          if line not in s: raise SystemExit('commands advisor Telegram command missing')
          s = s.replace(line, '', 1)
          commands.write_text(s)

          advisor = Path("src/advisor.ts")
          s = advisor.read_text()
          old = 'import type { AdvisorConfig, AdvisorRequest, AdvisorResult, AdvisorTarget } from "./advisorTypes.js";'
          if old not in s: raise SystemExit('advisor compatibility types import missing')
          s = s.replace(old, 'import type { AdvisorConfig, AdvisorTarget } from "./advisorTypes.js";', 1)
          if 'config.questionMaxChars' not in s: raise SystemExit('advisor question bound missing')
          s = s.replace('config.questionMaxChars', 'Math.min(config.contextMaxChars, 4_000)', 1)
          s = sub1(s, r'\n/\*\* Compatibility adapter for the old manual engine entry point;[\s\S]*$', '\n', 'advisor compatibility adapter')
          advisor.write_text(s)

          Path("src/advisorTypes.ts").write_text('''import type { ProviderId } from "./providers/types.js";\n\nexport interface AdvisorTarget { provider: ProviderId; model: string }\n\nexport interface AdvisorConfig {\n  enabled: boolean;\n  /** Allowed frontier targets. One independent target is selected per invocation; this is not a fallback chain. */\n  chain: AdvisorTarget[];\n  maxCallsPerTurn: number;\n  maxCallsPerTask: number;\n  timeoutMs: number;\n  contextMaxChars: number;\n  outputMaxChars: number;\n}\n''')

          Path("src/advisorConfig.ts").write_text('''import { isProviderId } from "./providers/registry.js";\nimport type { AdvisorConfig, AdvisorTarget } from "./advisorTypes.js";\n\ntype Env = Record<string, string | undefined>;\nconst positiveInt = (raw: string | undefined, fallback: number) => {\n  const value = Number.parseInt(raw ?? "", 10);\n  return Number.isFinite(value) && value > 0 ? value : fallback;\n};\nfunction parseTarget(raw: string): AdvisorTarget | null {\n  const split = raw.indexOf(":");\n  if (split <= 0) return null;\n  const rawProvider = raw.slice(0, split).trim();\n  const provider = rawProvider === "antigravity" ? "agy" : rawProvider;\n  const model = raw.slice(split + 1).trim();\n  return isProviderId(provider) && model ? { provider, model } : null;\n}\n\nexport function parseAdvisorConfig(env: Env = process.env): AdvisorConfig {\n  return {\n    enabled: /^(?:1|true|yes|on)$/i.test(env.BRIDGE_ADVISOR_ENABLED ?? ""),\n    chain: (env.BRIDGE_ADVISOR_CHAIN ?? "").split(",").map((value) => parseTarget(value.trim()))\n      .filter((value): value is AdvisorTarget => value !== null),\n    maxCallsPerTurn: positiveInt(env.BRIDGE_ADVISOR_MAX_CALLS_PER_TURN, 1),\n    maxCallsPerTask: positiveInt(env.BRIDGE_ADVISOR_MAX_CALLS_PER_TASK, 2),\n    timeoutMs: positiveInt(env.BRIDGE_ADVISOR_TIMEOUT_MS, 120_000),\n    contextMaxChars: positiveInt(env.BRIDGE_ADVISOR_CONTEXT_MAX_CHARS, 24_000),\n    outputMaxChars: 16_000,\n  };\n}\n''')

          broker = Path("src/advisorBroker.ts")
          s = broker.read_text()
          s = s.replace('  activeModel?: string | null;\n', '', 1)
          s = s.replace('  /** Legacy spellings accepted only so old installed helpers fail soft during rollout. */\n  task?: string;\n  mode?: string;\n', '', 1)
          if 'question: input.question ?? input.task ?? "",' not in s: raise SystemExit('broker legacy question mapping missing')
          s = s.replace('question: input.question ?? input.task ?? "",', 'question: input.question ?? "",', 1)
          broker.write_text(s)

          command = Path("src/advisorCommand.ts")
          s = command.read_text()
          if 'const question = flagValue(args, "--question") || flagValue(args, "--task");' not in s: raise SystemExit('advisor command legacy task alias missing')
          s = s.replace('const question = flagValue(args, "--question") || flagValue(args, "--task");', 'const question = flagValue(args, "--question");', 1)
          command.write_text(s)

          Path("skills/advisor/SKILL.md").write_text('''---\nname: advisor\ndescription: Get one bounded independent frontier opinion from a configured provider when the user asks for a second opinion or when an independent view would materially improve a decision.\n---\n\n# Advisor\n\nUse this Skill only when an independent frontier opinion has enough expected value to justify one extra model call. Agent Bridge itself does not suggest or auto-run it.\n\n## How to use it\n\n- Ask one small, decision-bearing question. Include only the context needed to answer it; do not send secrets or a full transcript.\n- When independence matters, request a configured provider different from the active provider. The Bridge chooses that provider's configured frontier/advisor model; do not try to select an arbitrary model.\n- Make one call only. Do not cascade, retry through another provider, or turn the advisor into a second executor.\n- Separate evidence you already have from your inference when framing the question.\n- Treat the answer as non-authoritative input. If it disagrees with your current view, surface the disagreement and decide from the evidence instead of averaging the conclusions.\n- Incorporate useful advice into the primary task yourself. You keep execution ownership and remain responsible for validation.\n- Skip the call when the likely decision impact is small.\n\nRun:\n\n```sh\n"$AGENT_BRIDGE_ADVISOR_COMMAND" --question "<question>" --context "<small relevant context>"\n```\n\nTo request a specific configured independent provider, add `--provider claude`, `--provider codex`, or `--provider agy`.\n''')

          for path in ["src/advisorService.ts", "src/advisorConfigSource.ts", "test/advisorInstallerPreservation.test.ts"]:
              p = Path(path)
              if p.exists(): p.unlink()

          env_example = Path(".env.shared.example")
          s = env_example.read_text()
          s = re.sub(r'^BRIDGE_ADVISOR_MODE=.*\n', '', s, count=1, flags=re.M)
          env_example.write_text(s)

          install = Path("scripts/install.sh")
          s = install.read_text()
          s = s.replace('health-troubleshooting"', 'health-troubleshooting,advisor"', 1)
          s = s.replace('BRIDGE_ADVISOR_ENABLED BRIDGE_ADVISOR_MODE BRIDGE_ADVISOR_CHAIN', 'BRIDGE_ADVISOR_ENABLED BRIDGE_ADVISOR_CHAIN')
          marker = '''  if [[ ",${skills_csv}," != *",autonomous-work,"* ]]; then\n    skills_csv="${skills_csv},autonomous-work"\n  fi\n'''
          if marker not in s: raise SystemExit('install autonomous skill guard missing')
          s = s.replace(marker, marker + '''  if [[ ",${skills_csv}," != *",advisor,"* ]]; then\n    skills_csv="${skills_csv},advisor"\n  fi\n''', 1)
          install.write_text(s)

          upgrade = Path("scripts/upgrade.sh")
          s = upgrade.read_text()
          s = s.replace('delivery-directives,autonomous-work"', 'delivery-directives,autonomous-work,advisor"', 1)
          if marker not in s: raise SystemExit('upgrade autonomous skill guard missing')
          s = s.replace(marker, marker + '''  if [[ ",${skills_csv}," != *",advisor,"* ]]; then\n    skills_csv="${skills_csv},advisor"\n  fi\n''', 1)
          upgrade.write_text(s)

          installer = Path("scripts/agent-bridge-install.py")
          s = installer.read_text()
          if '    "health-troubleshooting",\n)' not in s: raise SystemExit('python installer default skill list missing')
          s = s.replace('    "health-troubleshooting",\n)', '    "health-troubleshooting",\n    "advisor",\n)', 1)
          s = s.replace('"BRIDGE_ADVISOR_ENABLED", "BRIDGE_ADVISOR_MODE", "BRIDGE_ADVISOR_CHAIN",', '"BRIDGE_ADVISOR_ENABLED", "BRIDGE_ADVISOR_CHAIN",', 1)
          installer.write_text(s)

          Path('.github/workflows/issue-458-subtraction.yml').unlink()
          PY
      - name: Commit subtraction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: remove legacy Advisor orchestration paths"
          git push origin HEAD:agent/issue-458-advisor-skill
