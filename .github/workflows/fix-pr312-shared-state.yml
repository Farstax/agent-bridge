name: Fix PR 312 shared continuation state

on:
  push:
    branches:
      - agent/issue-261-turn-continuation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-261-turn-continuation
          fetch-depth: 0

      - name: Preserve current-main shared lane runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engine.ts')
          s = p.read_text()

          old = '''interface LaneRuntimeState {
            cancellationOperations: Map<string, LaneCancellation>;
            laneDrainers: Map<string, LaneDrainer>;
            finalDeliveryPhases: Map<string, FinalDeliveryPhase>;
            activeAugmentedTasks: Map<string, AugmentedTask>;
            transferredAugmentedLanes: Set<string>;
            abortedChats: Set<string>;
            resettingChats: Set<string>;
          }'''
          new = '''interface LaneRuntimeState {
            cancellationOperations: Map<string, LaneCancellation>;
            laneDrainers: Map<string, LaneDrainer>;
            finalDeliveryPhases: Map<string, FinalDeliveryPhase>;
            activeContinuations: Set<string>;
            activeAugmentedTasks: Map<string, AugmentedTask>;
            transferredAugmentedLanes: Set<string>;
            abortedChats: Set<string>;
            resettingChats: Set<string>;
          }'''
          if old not in s:
              raise SystemExit('LaneRuntimeState shape not found')
          s = s.replace(old, new, 1)

          old = '''      finalDeliveryPhases: new Map(),
                activeAugmentedTasks: new Map(),'''
          new = '''      finalDeliveryPhases: new Map(),
                activeContinuations: new Set(),
                activeAugmentedTasks: new Map(),'''
          if old not in s:
              raise SystemExit('lane runtime initializer not found')
          s = s.replace(old, new, 1)

          old = '''  private readonly cancellationOperations = new Map<string, LaneCancellation>();
            private readonly laneDrainers = new Map<string, LaneDrainer>();
            private readonly finalDeliveryPhases = new Map<string, FinalDeliveryPhase>();
            private readonly activeContinuations = new Set<string>();
            private readonly activeAugmentedTasks = new Map<string, AugmentedTask>();
            private readonly transferredAugmentedLanes = new Set<string>();'''
          new = '''  private readonly cancellationOperations: Map<string, LaneCancellation>;
            private readonly laneDrainers: Map<string, LaneDrainer>;
            private readonly finalDeliveryPhases: Map<string, FinalDeliveryPhase>;
            private readonly activeContinuations: Set<string>;
            private readonly activeAugmentedTasks: Map<string, AugmentedTask>;
            private readonly transferredAugmentedLanes: Set<string>;'''
          if old not in s:
              raise SystemExit('BridgeEngine shared-state declarations not found')
          s = s.replace(old, new, 1)

          old = '''    this.finalDeliveryPhases = laneRuntime.finalDeliveryPhases;
              this.activeAugmentedTasks = laneRuntime.activeAugmentedTasks;'''
          new = '''    this.finalDeliveryPhases = laneRuntime.finalDeliveryPhases;
              this.activeContinuations = laneRuntime.activeContinuations;
              this.activeAugmentedTasks = laneRuntime.activeAugmentedTasks;'''
          if old not in s:
              raise SystemExit('BridgeEngine lane runtime assignments not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          rm -f .github/workflows/fix-pr312-shared-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve shared lane state for continuation"
          git push origin HEAD:agent/issue-261-turn-continuation
