name: Architecture Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify the exact event head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # scripts/migrationOwnershipLint.mjs (Phase 4C.2, issue #135) parses
      # source with the TypeScript compiler API, so this job now needs
      # node_modules — sqlOwnershipLint.mjs previously used only Node
      # built-ins, which is why this step wasn't here before.
      - run: npm ci

      - name: Run architecture lint guard
        run: bash scripts/arch-lint.sh src
