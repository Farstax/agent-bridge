name: Issue 636 grounding patch

on:
  push:
    branches: [oss-636-native-repo-grounding]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue636-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oss-636-native-repo-grounding
          fetch-depth: 0
      - name: Apply repository-grounding qualification patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          q = Path('src/providers/qualification.ts')
          s = q.read_text()

          replacements = []
          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              'import { execFileSync } from "node:child_process";\n',
              'import { execFileSync } from "node:child_process";\nimport { randomUUID } from "node:crypto";\n',
          )
          replace_once('export const PROVIDER_CONTRACT_VERSION = 3;', 'export const PROVIDER_CONTRACT_VERSION = 4;')
          replace_once(
              '  | "unsupported"\n  | "not_authenticated";',
              '  | "unsupported"\n  | "not_authenticated"\n  | "capacity_exhausted"\n  | "model_unavailable"\n  | "transient";',
          )
          replace_once(
              '  name: "version" | "fresh_prompt" | "session_resume";',
              '  name: "version" | "fresh_prompt" | "session_resume" | "repository_grounding";',
          )
          replace_once(
              'const FRESH_PROBE = "Agent Bridge provider qualification probe.";\nconst RESUME_PROBE = "Agent Bridge provider qualification resume probe.";',
              'const FRESH_PROBE = "Agent Bridge provider qualification probe.";\nconst RESUME_PROBE = "Agent Bridge provider qualification resume probe.";\nconst REPOSITORY_GROUNDING_PROBE = "Agent Bridge repository-grounding qualification. Inspect this repository implementation and report the exact string value assigned to `repositoryGroundingQualificationFact`. Follow the repository native instructions. Reply concisely.";',
          )

          old_error = '''function checkForError(providerId: ProviderId, error: Error): {
            check: ProviderQualificationCheck;
            overall: "degraded" | "fail";
          } {
            const classification = classifyProviderError(providerId, error);
            if (classification.kind === "auth_required") {
              return {
                check: { name: "fresh_prompt", status: "not_authenticated", diagnostic: error.message.slice(0, 500) },
                overall: "degraded",
              };
            }
            const externalConstraint = classification.kind === "capacity_exhausted"
              || classification.kind === "model_unavailable"
              || classification.kind === "transient";
            return {
              check: { name: "fresh_prompt", status: "fail", diagnostic: error.message.slice(0, 500) },
              overall: externalConstraint ? "degraded" : "fail",
            };
          }'''
          new_error = '''function checkForError(
            providerId: ProviderId,
            error: Error,
            name: ProviderQualificationCheck["name"],
          ): {
            check: ProviderQualificationCheck;
            overall: "degraded" | "fail";
          } {
            const classification = classifyProviderError(providerId, error);
            if (classification.kind === "auth_required") {
              return {
                check: { name, status: "not_authenticated", diagnostic: error.message.slice(0, 500) },
                overall: "degraded",
              };
            }
            if (classification.kind === "capacity_exhausted"
              || classification.kind === "model_unavailable"
              || classification.kind === "transient") {
              return {
                check: { name, status: classification.kind, diagnostic: error.message.slice(0, 500) },
                overall: "degraded",
              };
            }
            return {
              check: { name, status: "fail", diagnostic: error.message.slice(0, 500) },
              overall: "fail",
            };
          }'''
          replace_once(old_error, new_error)

          anchor = '''  return { sessionId: parsed.sessionId };
          }

          export async function qualifyProvider(options: ProviderQualificationOptions): Promise<ProviderQualificationRecord> {'''
          grounding_impl = '''  return { sessionId: parsed.sessionId };
          }

          function createRepositoryGroundingFixture(providerId: ProviderId): {
            cwd: string;
            sourceFact: string;
            instructionMarker: string;
          } {
            const cwd = mkdtempSync(join(tmpdir(), `agent-bridge-grounding-${providerId}-`));
            const nonce = randomUUID().replace(/-/g, "");
            const sourceFact = `AGENT_BRIDGE_GROUNDING_FACT_${nonce}`;
            const instructionMarker = `AGENT_BRIDGE_GROUNDING_INSTRUCTION_${nonce}`;
            try {
              mkdirSync(join(cwd, "src"), { recursive: true, mode: 0o700 });
              writeFileSync(
                join(cwd, "src", "repositoryGroundingFixture.ts"),
                `export const repositoryGroundingQualificationFact = "${sourceFact}";\n`,
                { encoding: "utf8", mode: 0o600 },
              );
              writeFileSync(
                join(cwd, "AGENTS.md"),
                [
                  "# Agent Bridge provider qualification",
                  "",
                  "For implementation-specific questions in this repository, inspect relevant implementation source before answering.",
                  `When answering the repository-grounding qualification question, include this exact marker: ${instructionMarker}`,
                  "",
                ].join("\n"),
                { encoding: "utf8", mode: 0o600 },
              );
              writeFileSync(
                join(cwd, "CLAUDE.md"),
                "`AGENTS.md` is authoritative for repository instructions. Read it before answering implementation-specific questions.\n",
                { encoding: "utf8", mode: 0o600 },
              );
              writeFileSync(
                join(cwd, "ANTIGRAVITY.md"),
                "`AGENTS.md` is authoritative for repository instructions. Read it before answering implementation-specific questions.\n",
                { encoding: "utf8", mode: 0o600 },
              );
              execFileSync("git", ["init", "--quiet"], {
                cwd,
                stdio: ["ignore", "ignore", "pipe"],
                timeout: 5_000,
              });
              return { cwd, sourceFact, instructionMarker };
            } catch (error) {
              rmSync(cwd, { recursive: true, force: true });
              throw error;
            }
          }

          async function executeRepositoryGroundingCheck({
            providerId,
            executable,
            homeDir,
            timeoutMs,
          }: {
            providerId: ProviderId;
            executable: string;
            homeDir: string;
            timeoutMs: number;
          }): Promise<void> {
            const bot = providerBotKind(providerId);
            const fixture = createRepositoryGroundingFixture(providerId);
            try {
              const invocation = buildCliInvocation({
                bot,
                prompt: REPOSITORY_GROUNDING_PROBE,
                sessionId: null,
                command: executable,
                model: null,
                executionMode: "safe",
                outputFormat: providerId === "agy" ? "stream-json" : "json",
                soulContext: null,
                includeResponseContract: false,
                attachments: [],
                outputDir: null,
                effort: null,
                homeDir,
                toolMode: "default",
                nativeCompletion: true,
              });
              if (invocation.nativeSessionMode !== "fresh") {
                throw new Error("repository grounding qualification failed: invocation did not enter native fresh mode");
              }
              const stdout = await runQualificationInvocation({
                providerId,
                command: invocation.command,
                args: invocation.args,
                cwd: fixture.cwd,
                homeDir,
                timeoutMs,
              });
              const parsed = parseCliResult({
                bot,
                stdout,
                outputFormat: qualificationOutputFormat(invocation.args),
              });
              const missing: string[] = [];
              if (!parsed.text.includes(fixture.sourceFact)) missing.push("source fact");
              if (!parsed.text.includes(fixture.instructionMarker)) missing.push("repository instruction marker");
              if (missing.length > 0) {
                throw new Error(`repository grounding qualification failed: response omitted ${missing.join(" and ")}`);
              }
            } finally {
              rmSync(fixture.cwd, { recursive: true, force: true });
            }
          }

          export async function qualifyProvider(options: ProviderQualificationOptions): Promise<ProviderQualificationRecord> {'''
          replace_once(anchor, grounding_impl)

          replace_once(
              '      checks.push({ name: "fresh_prompt", status: "not_applicable" });\n      checks.push({ name: "session_resume", status: "not_applicable" });\n      overall = "fail";',
              '      checks.push({ name: "fresh_prompt", status: "not_applicable" });\n      checks.push({ name: "session_resume", status: "not_applicable" });\n      checks.push({ name: "repository_grounding", status: "not_applicable" });\n      overall = "fail";',
          )
          replace_once(
              '      const failure = checkForError(options.providerId, error);\n      checks.push(failure.check);\n      checks.push({ name: "session_resume", status: "not_applicable" });\n      overall = failure.overall;',
              '      const failure = checkForError(options.providerId, error, "fresh_prompt");\n      checks.push(failure.check);\n      checks.push({ name: "session_resume", status: "not_applicable" });\n      checks.push({ name: "repository_grounding", status: "not_applicable" });\n      overall = failure.overall;',
          )

          old_resume = '''      } catch (caught) {
                const error = caught instanceof Error ? caught : new Error(String(caught));
                const classification = classifyProviderError(options.providerId, error);
                if (classification.kind === "auth_required") {
                  checks.push({ name: "session_resume", status: "not_authenticated", diagnostic: error.message.slice(0, 500) });
                  overall = "degraded";
                } else {
                  checks.push({ name: "session_resume", status: "fail", diagnostic: error.message.slice(0, 500) });
                  overall = classification.kind === "capacity_exhausted"
                    || classification.kind === "model_unavailable"
                    || classification.kind === "transient"
                    ? "degraded"
                    : "fail";
                }
              }
            }

            const record: ProviderQualificationRecord = {'''
          new_resume = '''      } catch (caught) {
                const error = caught instanceof Error ? caught : new Error(String(caught));
                const failure = checkForError(options.providerId, error, "session_resume");
                checks.push(failure.check);
                checks.push({ name: "repository_grounding", status: "not_applicable" });
                overall = failure.overall;
              }
            }

            if (checks.some((check) => check.name === "session_resume" && check.status === "pass")) {
              try {
                await executeRepositoryGroundingCheck({
                  providerId: options.providerId,
                  executable,
                  homeDir,
                  timeoutMs,
                });
                checks.push({ name: "repository_grounding", status: "pass" });
              } catch (caught) {
                const error = caught instanceof Error ? caught : new Error(String(caught));
                const failure = checkForError(options.providerId, error, "repository_grounding");
                checks.push(failure.check);
                overall = failure.overall;
              }
            }

            const record: ProviderQualificationRecord = {'''
          replace_once(old_resume, new_resume)
          q.write_text(s)

          test = Path('test/providerQualification.test.ts')
          t = test.read_text()
          old_helper = '''function executable(path: string, body: string): string {
            writeFileSync(path, `#!/usr/bin/env bash\\nset -euo pipefail\\n${body}`, { mode: 0o755 });
            chmodSync(path, 0o755);
            return path;
          }'''
          new_helper = '''type GroundingMode = "pass" | "omit_instruction" | "capacity";

          function executable(path: string, body: string, groundingMode: GroundingMode = "pass"): string {
            const groundingAction = groundingMode === "capacity"
              ? 'echo "usage limit reached" >&2\\nexit 1'
              : `response="${groundingMode === "omit_instruction" ? "$fact" : "$fact $marker"}"
          provider="$(basename "$0")"
          case "$provider" in
            codex)
              printf '%s\\\\n' '{"type":"thread.started","thread_id":"11111111-2222-3333-4444-555555555555"}'
              printf '{"type":"item.completed","item":{"type":"agent_message","text":"%s"}}\\\\n' "$response"
              ;;
            claude)
              printf '{"result":"%s","session_id":"11111111-2222-3333-4444-555555555555"}\\\\n' "$response"
              ;;
            agy)
              printf '{"event":"result","result":{"conversation_id":"11111111-2222-3333-4444-555555555555","status":"SUCCESS","response":"%s"}}\\\\n' "$response"
              ;;
            grok)
              printf '{"type":"text","data":"%s"}\\\\n' "$response"
              printf '%s\\\\n' '{"type":"end","sessionId":"11111111-2222-3333-4444-555555555555","stopReason":"end_turn"}'
              ;;
            cursor-agent|cursor)
              printf '{"type":"result","subtype":"success","is_error":false,"result":"%s","session_id":"11111111-2222-3333-4444-555555555555"}\\\\n' "$response"
              ;;
            *) echo "unsupported fake provider" >&2; exit 99 ;;
          esac
          exit 0`;
            const groundingPrelude = `
          if [[ " $* " == *"Agent Bridge repository-grounding qualification."* ]]; then
            if [[ " $* " == *"AGENT_BRIDGE_GROUNDING_FACT_"* || " $* " == *"AGENT_BRIDGE_GROUNDING_INSTRUCTION_"* ]]; then
              echo "grounding markers leaked into prompt" >&2
              exit 95
            fi
            if [[ " $* " == *" --disable shell_tool "* || " $* " == *" --tools "* || " $* " == *" --sandbox "* ]]; then
              echo "native repository tools disabled during grounding probe" >&2
              exit 96
            fi
            fact="$(grep -o 'AGENT_BRIDGE_GROUNDING_FACT_[A-Za-z0-9]*' src/repositoryGroundingFixture.ts | head -n1)"
            marker="$(grep -o 'AGENT_BRIDGE_GROUNDING_INSTRUCTION_[A-Za-z0-9]*' AGENTS.md | head -n1)"
            [[ -n "$fact" && -n "$marker" ]] || { echo "grounding fixture unavailable" >&2; exit 97; }
            ${groundingAction}
          fi
          `;
            writeFileSync(path, `#!/usr/bin/env bash\\nset -euo pipefail\\n${groundingPrelude}\\n${body}`, { mode: 0o755 });
            chmodSync(path, 0o755);
            return path;
          }

          type TestProvider = "codex" | "claude" | "agy" | "grok" | "cursor";

          function passingProviderBody(provider: TestProvider): string {
            const version = provider === "codex" ? "codex-cli 9.9.9"
              : provider === "claude" ? "Claude Code 2.3.4"
              : provider === "agy" ? "agy 1.1.12"
              : provider === "grok" ? "grok 1.2.3"
              : "cursor-agent 1.2.3";
            const session = "11111111-2222-3333-4444-555555555555";
            const success = provider === "codex"
              ? `printf '%s\\\\n' '{"type":"thread.started","thread_id":"${session}"}'\\nprintf '%s\\\\n' '{"type":"item.completed","item":{"type":"agent_message","text":"native protocol response"}}'`
              : provider === "claude"
                ? `printf '%s\\\\n' '{"result":"native protocol response","session_id":"${session}"}'`
                : provider === "agy"
                  ? `printf '%s\\\\n' '{"event":"result","result":{"conversation_id":"${session}","status":"SUCCESS","response":"native protocol response"}}'`
                  : provider === "grok"
                    ? `printf '%s\\\\n' '{"type":"text","data":"native protocol response"}'\\nprintf '%s\\\\n' '{"type":"end","sessionId":"${session}","stopReason":"end_turn"}'`
                    : `printf '%s\\\\n' '{"type":"result","subtype":"success","is_error":false,"result":"native protocol response","session_id":"${session}"}'`;
            return `if [[ "\\${1:-}" == "--version" ]]; then echo "${version}"; exit 0; fi\\n${success}`;
          }'''
          if old_helper not in t:
              raise SystemExit('providerQualification helper anchor missing')
          t = t.replace(old_helper, new_helper, 1)
          t = t.replace(
              '      { name: "session_resume", status: "pass" },\n    ],',
              '      { name: "session_resume", status: "pass" },\n      { name: "repository_grounding", status: "pass" },\n    ],',
              1,
          )
          t = t.replace(
              '      ["session_resume", "pass"],\n    ]);',
              '      ["session_resume", "pass"],\n      ["repository_grounding", "pass"],\n    ]);',
              1,
          )
          new_tests = r'''

            it.each(["codex", "claude", "agy", "grok", "cursor"] as const)(
              "runs repository-grounding qualification with native tools for %s",
              async (provider) => {
                const root = mkdtempSync(join(tmpdir(), `provider-grounding-${provider}-`));
                const command = provider === "cursor" ? "cursor-agent" : provider;
                const fake = executable(join(root, command), passingProviderBody(provider));
                const result = await qualifyProvider({
                  providerId: provider,
                  executable: fake,
                  evidencePath: join(root, "qualification.json"),
                  bridgeCommit: "6".repeat(40),
                  cwd: root,
                  homeDir: root,
                  timeoutMs: 5_000,
                });

                expect(result.overall).toBe("pass");
                expect(result.checks.find((check) => check.name === "repository_grounding")).toEqual({
                  name: "repository_grounding",
                  status: "pass",
                });
              },
            );

            it("fails repository grounding when the native answer omits the repository instruction marker", async () => {
              const root = mkdtempSync(join(tmpdir(), "provider-grounding-omission-"));
              const fake = executable(join(root, "codex"), passingProviderBody("codex"), "omit_instruction");
              const result = await qualifyProvider({
                providerId: "codex",
                executable: fake,
                evidencePath: join(root, "qualification.json"),
                bridgeCommit: "7".repeat(40),
                cwd: root,
                homeDir: root,
                timeoutMs: 5_000,
              });

              expect(result.overall).toBe("fail");
              expect(result.checks.find((check) => check.name === "repository_grounding")).toMatchObject({
                status: "fail",
                diagnostic: expect.stringMatching(/repository instruction marker/i),
              });
            });

            it("keeps provider capacity exhaustion distinct from a deterministic grounding failure", async () => {
              const root = mkdtempSync(join(tmpdir(), "provider-grounding-capacity-"));
              const fake = executable(join(root, "codex"), passingProviderBody("codex"), "capacity");
              const result = await qualifyProvider({
                providerId: "codex",
                executable: fake,
                evidencePath: join(root, "qualification.json"),
                bridgeCommit: "8".repeat(40),
                cwd: root,
                homeDir: root,
                timeoutMs: 5_000,
              });

              expect(result.overall).toBe("degraded");
              expect(result.checks.find((check) => check.name === "repository_grounding")).toMatchObject({
                status: "capacity_exhausted",
                diagnostic: expect.stringMatching(/usage limit/i),
              });
            });
          '''
          idx = t.rfind('\n});')
          if idx < 0:
              raise SystemExit('providerQualification describe end missing')
          t = t[:idx] + new_tests + t[idx:]
          test.write_text(t)

          issue_test = Path('test/issue636RepositoryGroundingInstructions.test.ts')
          itxt = issue_test.read_text()
          itxt = itxt.replace(
              '    ["antigravity" as const, "ANTIGRAVITY_PROJECT_DIR", "/tmp/issue636-agy"],\n',
              '    ["antigravity" as const, "ANTIGRAVITY_PROJECT_DIR", "/tmp/issue636-agy"],\n    ["grok" as const, "GROK_PROJECT_DIR", "/tmp/issue636-grok"],\n    ["cursor" as const, "CURSOR_PROJECT_DIR", "/tmp/issue636-cursor"],\n',
              1,
          )
          issue_test.write_text(itxt)

          doc = Path('docs/PROVIDER-QUALIFICATION.md')
          d = doc.read_text()
          d = d.replace('## Contract v1\n\n`agent_bridge_provider_contract: 1`', '## Contract v4\n\n`agent_bridge_provider_contract: 4`', 1)
          d = d.replace(
              '3. `session_resume` — when the fresh result exposes an invocation-attributable session ID, a second bounded prompt resumes that session and returns the resume marker. Providers that do not expose such an ID report `not_applicable`.\n',
              '3. `session_resume` — when the fresh result exposes an invocation-attributable session ID, a second bounded prompt resumes that session and returns the resume marker. Providers that do not expose such an ID report `not_applicable`.\n4. `repository_grounding` — one fresh native-tool-enabled invocation runs in a disposable Git repository. A runtime-generated source fact lives only in implementation source and a separate runtime-generated marker lives only in repository instructions; neither is included in the prompt. The check passes only when the native provider returns both exact values.\n',
              1,
          )
          d = d.replace(
              'Check states are `pass`, `fail`, `not_applicable`, `unsupported`, and `not_authenticated`.',
              'Check states are `pass`, `fail`, `not_applicable`, `unsupported`, `not_authenticated`, `capacity_exhausted`, `model_unavailable`, and `transient`.',
              1,
          )
          d = d.replace(
              'Deterministic provider-boundary fixtures remain part of the ordinary test suite. Live qualification is not run on every service startup or every PR.\n',
              'Deterministic provider-boundary fixtures remain part of the ordinary test suite. Live qualification is not run on every service startup or every PR. The repository-grounding check is a capability/contract probe, not a subjective answer-quality benchmark: it uses exact runtime-generated facts and local comparison, so it adds no model-as-judge call.\n',
              1,
          )
          d = d.replace(
              '- Only the changed provider is qualified.\n',
              '- Only the changed provider is qualified. A contract-version change invalidates prior tuples once, so contract v4 adds one repository-grounding fresh invocation to the next required qualification for each affected provider and then reuses the cached evidence.\n',
              1,
          )
          doc.write_text(d)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/qualification.ts test/providerQualification.test.ts test/issue636RepositoryGroundingInstructions.test.ts docs/PROVIDER-QUALIFICATION.md
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "Add provider repository grounding qualification [issue636-patch]"
          git push origin HEAD:oss-636-native-repo-grounding
