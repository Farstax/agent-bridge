name: Apply instruction first rule v3
on:
  push:
    branches: ["agent/issue-449-instruction-first-agents"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Edit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path("AGENTS.md")
          text = path.read_text()
          heading = "## Prefer agent instructions over machinery"
          anchor = "Add Bridge-owned machinery only when a concrete cross-provider, durability, lifecycle, or safety requirement cannot be met at the native CLI boundary.\n\n---"
          section = base64.b64decode("").decode()
          if heading not in text:
              if anchor not in text:
                  raise SystemExit("expected AGENTS.md anchor not found")
              text = text.replace(anchor, anchor[:-3] + section + "\n---", 1)
              path.write_text(text)
          PY
          rm -f .github/workflows/apply-instruction-first-rule.yml .github/workflows/apply-instruction-first-rule-v2.yml .github/workflows/apply-instruction-first-rule-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: prefer agent instructions over machinery"
          git push origin HEAD:"${GITHUB_REF_NAME}"
