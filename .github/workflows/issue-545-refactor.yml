name: Issue 545 refactor

on:
  push:
    branches:
      - fix/545-unify-provider-execution

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/545-unify-provider-execution
          fetch-depth: 0
      - name: Apply execution-path refactor
        run: python3 scripts/issue545-refactor.py
      - name: Validate candidate diff
        run: |
          git diff --check
          git diff --stat
          npm ci
          npm run typecheck
          npx vitest run test/providerAttemptPipelineOwnership.test.ts test/execution-paths.test.ts test/executionLaneCorrectness.test.ts test/crossEngineQueueRecovery.test.ts test/arch/executionTopologyLint.test.ts
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify provider execution path (#545)"
          git push origin HEAD:fix/545-unify-provider-execution
