name: Issue 545 refactor

on:
  push:
    branches:
      - fix/545-unify-provider-execution

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/545-unify-provider-execution
          fetch-depth: 0
      - name: Collapse deleted mode fixtures
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          for target in ["test/executionLaneCorrectness.test.ts", "test/engine.test.ts"]:
              path = Path(target)
              text = path.read_text()
              text = text.replace(
                  '    { mode: "synchronous", asyncEnabled: false },\n    { mode: "asynchronous", asyncEnabled: true },',
                  '    { mode: "canonical" },',
              )
              text = text.replace('async ({ mode, asyncEnabled }) => {', 'async ({ mode }) => {')
              text = re.sub(r',\s*asyncEnabled(?=\s*[,}])', '', text)
              text = re.sub(r'\basyncEnabled,\s*', '', text)
              text = re.sub(r'\basyncEnabled:\s*(?:true|false|mode === "async")\s*,?', '', text)
              path.write_text(text)
          PY
      - name: Apply execution-path refactor
        shell: bash
        run: |
          if ! python3 scripts/issue545-refactor.py; then
            grep -RInE 'BRIDGE_ASYNC_ENABLED|asyncEnabled' src test docs .env.*.example 2>/dev/null || true
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          for name in changed:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              path.write_text("\n".join(line.rstrip() for line in text.splitlines()) + ("\n" if text.endswith("\n") else ""))
          PY
      - name: Validate candidate diff
        run: |
          git diff --check
          git diff --stat
          npm ci
          npm run typecheck
          npx vitest run test/providerAttemptPipelineOwnership.test.ts test/execution-paths.test.ts test/executionLaneCorrectness.test.ts test/crossEngineQueueRecovery.test.ts test/arch/executionTopologyLint.test.ts
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify provider execution path (#545)"
          git push origin HEAD:fix/545-unify-provider-execution
