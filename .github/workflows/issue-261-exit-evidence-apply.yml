name: Apply Issue 261 exit-evidence fix

on:
  push:
    branches:
      - agent/issue-261-turn-continuation
    paths:
      - .github/issue261-exit-evidence-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed timing fix
        run: |
          set -euo pipefail
          git apply --check scripts/issue-261-exit-evidence.patch
          git apply scripts/issue-261-exit-evidence.patch
          git rm scripts/issue-261-exit-evidence.patch
          git rm .github/issue261-exit-evidence-trigger
          git rm .github/workflows/issue-261-exit-evidence-apply.yml

      - name: Commit timing fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts
          git commit -m "fix: preserve continuation evidence from CLI exit"
          git push origin HEAD:agent/issue-261-turn-continuation
