name: Remove compatibility diagnostics

on:
  push:
    branches:
      - agent/remove-compatibility-diagnostics

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unused diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = {
              "src/index.ts": (
                  'import { logCompatibilityDiagnostics } from "./compatibilityDiagnostics.js";\n',
                  'logCompatibilityDiagnostics("telegram-standalone");\n',
              ),
              "src/index-worker.ts": (
                  'import { logCompatibilityDiagnostics } from "./compatibilityDiagnostics.js";\n',
                  'logCompatibilityDiagnostics("telegram-worker");\n',
              ),
              "src/index-interactive.ts": (
                  'import { logCompatibilityDiagnostics } from "./compatibilityDiagnostics.js";\n',
                  'logCompatibilityDiagnostics("telegram-interactive");\n',
              ),
              "src/index-health.ts": (
                  'import { logCompatibilityDiagnostics } from "./compatibilityDiagnostics.js";\n',
                  'logCompatibilityDiagnostics("telegram-health");\n',
              ),
              "src/index-discord-interactive.ts": (
                  'import { logCompatibilityDiagnostics } from "./compatibilityDiagnostics.js";\n',
                  'logCompatibilityDiagnostics("discord-interactive");\n',
              ),
          }

          for filename, needles in targets.items():
              path = Path(filename)
              text = path.read_text()
              for needle in needles:
                  if text.count(needle) != 1:
                      raise SystemExit(f"expected exactly one occurrence in {filename}: {needle.strip()}")
                  text = text.replace(needle, "")
              path.write_text(text)
          PY

          rm -f \
            src/compatibilityDiagnostics.ts \
            test/compatibilityDiagnostics.test.ts \
            docs/roadmap/phase5-compatibility-retirement.md \
            .github/workflows/remove-compatibility-diagnostics.yml

          if grep -R -n -E 'compatibilityDiagnostics|logCompatibilityDiagnostics' src test docs --exclude-dir=node_modules; then
            echo "residual compatibility diagnostics reference found" >&2
            exit 1
          fi
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate
        run: |
          npm run typecheck
          npm test

      - name: Commit removal
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused compatibility diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
