name: Repair canonical terminal event keys

on:
  push:
    branches:
      - fix/278-canonical-chat-key

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[terminal-key-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/278-canonical-chat-key
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Add canonical key to corrected terminal events
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engine.ts')
          text = p.read_text()
          old = '''          chatId: eventContext.chatId,\n          threadId: eventContext.threadId,'''
          new = '''          chatId: eventContext.chatId,\n          chatKey: eventContext.chatKey,\n          threadId: eventContext.threadId,'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two manual terminal events, found {count}')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit review repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts
          git commit -m "fix: preserve canonical key on terminal events [terminal-key-repair]"
          git push origin HEAD:fix/278-canonical-chat-key
      - run: npm ci
      - name: Focused verification
        run: |
          npm run typecheck
          npx vitest run test/canonicalConversationIdentity.test.ts test/eventStore.test.ts test/runIngress.test.ts
