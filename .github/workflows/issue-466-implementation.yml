name: Issue 466 Implementation

on:
  push:
    branches:
      - agent/issue-466-first-class-autonomy-runtime

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark runner start
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "runner started for $GITHUB_SHA" > issue466-runner-started.txt
          git add issue466-runner-started.txt
          git commit -m 'chore: mark issue 466 runner start'
          git push origin HEAD
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          if ! python3 scripts/issue466-implement.py > /tmp/issue466-patch.log 2>&1; then
            cat /tmp/issue466-patch.log
            cp /tmp/issue466-patch.log ISSUE466_PATCH_FAILURE.txt
            git add ISSUE466_PATCH_FAILURE.txt
            git commit -m 'chore: record issue 466 patch failure'
            git push origin HEAD
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Unused exports
        run: npm run unused
      - name: Architecture lint
        run: npm run arch:lint
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          rm .github/workflows/issue-466-implementation.yml scripts/issue466-implement.py issue466-runner-started.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make autonomous runtime first class'
          git push origin HEAD
