name: Issue 466 Implementation

on:
  push:
    branches:
      - agent/issue-466-first-class-autonomy-runtime

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply implementation
        run: python3 scripts/issue466-implement.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Unused exports
        run: npm run unused
      - name: Architecture lint
        run: npm run arch:lint
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          rm .github/workflows/issue-466-implementation.yml scripts/issue466-implement.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make autonomous runtime first class'
          git push origin HEAD
