name: Issue 466 Implementation

on:
  push:
    branches:
      - agent/issue-466-first-class-autonomy-runtime
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-466-first-class-autonomy-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/issue466-implement.py 2>&1 | tee /tmp/issue466-patch.log
          python3 scripts/issue466-repair.py 2>&1 | tee -a /tmp/issue466-patch.log
          python3 scripts/issue466-repair2.py 2>&1 | tee -a /tmp/issue466-patch.log
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        shell: bash
        run: |
          set +e
          npm test > /tmp/issue466-test.log 2>&1
          status=$?
          cat /tmp/issue466-test.log
          if [[ $status -ne 0 ]]; then
            cp /tmp/issue466-test.log ISSUE466_TEST_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ISSUE466_TEST_FAILURE.txt
            git commit -m 'chore: record issue 466 test failure'
            git push origin HEAD:agent/issue-466-first-class-autonomy-runtime
            exit $status
          fi
      - name: Unused exports
        shell: bash
        run: |
          set +e
          npm run unused > /tmp/issue466-unused.log 2>&1
          status=$?
          cat /tmp/issue466-unused.log
          if [[ $status -ne 0 ]]; then
            cp /tmp/issue466-unused.log ISSUE466_UNUSED_FAILURE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ISSUE466_UNUSED_FAILURE.txt
            git commit -m 'chore: record issue 466 unused-export failure'
            git push origin HEAD:agent/issue-466-first-class-autonomy-runtime
            exit $status
          fi
      - name: Architecture lint
        run: npm run arch:lint
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/issue-466-implementation.yml scripts/issue466-implement.py scripts/issue466-repair.py scripts/issue466-repair2.py issue466-runner-started.txt ISSUE466_TEST_FAILURE.txt ISSUE466_UNUSED_FAILURE.txt ISSUE466_PATCH_FAILURE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make autonomous runtime first class'
          git push origin HEAD:agent/issue-466-first-class-autonomy-runtime
