name: Issue 737 audit
on:
  push:
    branches:
      - feature/737-promote-codex-acp
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy Codex reference inventory
        run: |
          echo '=== selector/native runtime refs ==='
          grep -RInE 'AGENT_BRIDGE_CODEX_RUNTIME|resolveCodexRuntime|isCodexAcpRuntime|codexRuntimeSelection|providers/codexRuntime(\.js|\.ts)' src test scripts docs .env* 2>/dev/null || true
          echo '=== codex exec/native parser refs ==='
          grep -RInE 'codex exec|parseCodex|Codex.*JSONL|JSONL.*Codex|native.*Codex|Codex.*native' src test scripts docs .env* 2>/dev/null || true
