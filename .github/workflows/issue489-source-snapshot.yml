name: Issue 489 source snapshot

on:
  push:
    branches:
      - agent/issue-489-native-completion-subtraction

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: issue489-source-${{ github.sha }}
          path: |
            .
            !node_modules
            !.git
          include-hidden-files: true
