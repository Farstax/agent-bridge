name: Issue 737 migrate
on:
  push:
    branches:
      - feature/737-promote-codex-acp
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'chore-issue737-large-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete native Codex qualification fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('test/providerQualification.test.ts')
          text = p.read_text()
          pattern = r'\n  it\("accepts native Codex result/session evidence without semantic marker prose", async \(\) => \{.*?\n  \}\);\n(?=\n  it\("accepts native Claude result/session evidence)'
          text, count = re.subn(pattern, '', text, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one obsolete Codex qualification fixture, found {count}')
          p.write_text(text)
          p = Path('docs/prompt-optimization-loop-research.md')
          text = p.read_text()
          marker = '`TELEGRAM_RESPONSE_STYLE` block. It does not change production bridge behavior.\n'
          replacement = marker + 'Its `CodexPipeClient` is an out-of-band research harness that invokes the Codex CLI directly; it is not an Agent Bridge provider runtime, readiness, qualification, or delivery path.\n'
          if marker not in text:
              raise SystemExit('prompt optimization ownership marker missing')
          p.write_text(text.replace(marker, replacement, 1))
          p = Path('src/providers/codexAcpAuthProbe.ts')
          text = p.read_text()
          if 'removed native Codex runtime runtime' in text:
              text = text.replace('removed native Codex runtime runtime', 'removed native Codex runtime')
          p.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/providerQualification.test.ts docs/prompt-optimization-loop-research.md src/providers/codexAcpAuthProbe.ts
          git commit -m 'test: remove obsolete Codex native qualification fixture'
          git push origin HEAD:feature/737-promote-codex-acp
