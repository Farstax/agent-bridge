name: Issue 737 migrate
on:
  push:
    branches:
      - feature/737-promote-codex-acp
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'chore-issue737-converge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ACP-only convergence
        run: python3 scripts/issue737-converge.py
      - name: Commit convergence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: converge Codex ACP promotion coverage'
          git push origin HEAD:feature/737-promote-codex-acp
