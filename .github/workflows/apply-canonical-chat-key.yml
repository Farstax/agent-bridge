name: Apply canonical chat key patch

on:
  push:
    branches:
      - fix/278-canonical-chat-key

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/278-canonical-chat-key
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Observe regression RED
        shell: bash
        run: |
          python3 scripts/apply-canonical-chat-key.py tests
          set +e
          npx vitest run test/canonicalConversationIdentity.test.ts > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected canonical identity regression to fail on pre-fix code"
            exit 1
          fi
      - name: Apply implementation
        run: python3 scripts/apply-canonical-chat-key.py implementation
      - name: Verify focused GREEN
        run: npx vitest run test/canonicalConversationIdentity.test.ts test/eventStore.test.ts
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use canonical surface chat key [canonical-patch-applied]"
          git push origin HEAD:fix/278-canonical-chat-key
