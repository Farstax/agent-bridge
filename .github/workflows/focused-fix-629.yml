name: Focused fix 629

on:
  push:
    branches:
      - fix/629-routine-run-correlation

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: python3 scripts/focused-fix-629.py
      - run: npm ci
      - name: Focused tests only
        run: npx vitest run test/runtimeInspector.test.ts test/scheduledRoutines.test.ts
      - name: Commit tested fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtimeInspector.ts test/runtimeInspector.test.ts
          git rm -f .github/workflows/focused-fix-629.yml scripts/focused-fix-629.py .focused-fix-629
          git commit -m 'fix: correlate scheduled occurrences with bounded Runs (#629)'
          git push origin HEAD:fix/629-routine-run-correlation
