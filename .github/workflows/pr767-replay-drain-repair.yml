name: PR 767 replay drain repair

on:
  push:
    branches: [feature/763-acp-session-config]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/763-acp-session-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Apply deterministic replay drain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/acp/client.ts')
          text = path.read_text()
          old = '''      setupState = sessionSetupState(await agent.request(acp.methods.agent.session.load, {
        sessionId: acpSessionId,
        ...sessionParams,
      }));
      gate.endLoad();'''
          new = '''      setupState = sessionSetupState(await agent.request(acp.methods.agent.session.load, {
        sessionId: acpSessionId,
        ...sessionParams,
      }));
      // SDK 1.4 dispatches incoming notifications asynchronously from response
      // resolution. A load response is written after replay notifications, so
      // drain those already-dispatched handlers before consuming replayed
      // config state. This is an event-loop ordering barrier, not a timer.
      await new Promise<void>((resolve) => queueMicrotask(resolve));
      gate.endLoad();'''
          assert old in text, 'load block changed unexpectedly'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Focused verification
        run: npx vitest run test/acpSessionConfig.test.ts test/claudeAcpRuntime.test.ts
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/pr767-replay-drain-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/acp/client.ts .github/workflows/pr767-replay-drain-repair.yml
          git commit -m "fix: drain ACP load replay before config negotiation"
          git push origin HEAD:feature/763-acp-session-config
