name: PR 767 replay order repair

on:
  push:
    branches:
      - feature/763-acp-session-config

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/763-acp-session-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Put session updates ahead of permission dispatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/acp/client.ts')
          text = path.read_text()
          start = text.index('  const clientApp = acp.client({ name: "agent-bridge" })')
          request_start = text.index('    .onRequest(acp.methods.client.session.requestPermission', start)
          notification_start = text.index('    .onNotification(acp.methods.client.session.update', request_start)
          end = text.index('\n\n  const execute =', notification_start)
          request_block = text[request_start:notification_start].rstrip()
          notification_block = text[notification_start:end].rstrip()
          assert request_block.endswith('})'), 'permission handler shape changed unexpectedly'
          assert notification_block.endswith('});'), 'session update handler shape changed unexpectedly'
          notification_block = notification_block[:-1]
          request_block = request_block + ';'
          reordered = notification_block + '\n' + request_block
          path.write_text(text[:request_start] + reordered + text[end:])
          PY
      - name: Focused verification
        run: npx vitest run test/acpSessionConfig.test.ts test/claudeAcpRuntime.test.ts test/acpTelegramConfigCallback.test.ts
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/pr767-replay-drain-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/acp/client.ts .github/workflows/pr767-replay-drain-repair.yml
          git commit -m "fix: preserve ACP load replay ordering"
          git push origin HEAD:feature/763-acp-session-config
