name: Apply PR 235 rollout-impact guidance

on:
  pull_request:
    paths: [.github/workflows/pr235-agents-rollout-impact.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-217-augment-default
          fetch-depth: 0

      - name: Apply the guidance update
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git apply --index .github/patches/pr235-agents-rollout-impact.patch
          git rm .github/patches/pr235-agents-rollout-impact.patch .github/workflows/pr235-agents-rollout-impact.yml
          git diff --cached --check
          git commit -m "docs: require rollout-impact assessment"
          git push origin HEAD:feat/issue-217-augment-default
