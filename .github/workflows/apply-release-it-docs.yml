name: Apply release-it documentation

on:
  push:
    branches: [agent/release-it-docs]

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-it-docs
      - name: Update AGENTS.md
        shell: python
        run: |
          from pathlib import Path

          path = Path("AGENTS.md")
          text = path.read_text()

          old_flow = "`issue → branch/PR → implementation → relevant validation → independent review → in-scope review repairs → required exact-head checks → merge → post-merge branch/worktree cleanup → compact completion report`"
          new_flow = "`issue → branch/PR → implementation + affected documentation → relevant validation → independent review → in-scope review repairs → required exact-head checks → merge → post-merge branch/worktree cleanup → compact completion report`"
          if text.count(old_flow) != 1:
              raise SystemExit("ship-it flow anchor not found exactly once")
          text = text.replace(old_flow, new_flow)

          ship_anchor = "Production deployment, destructive operations, credential/permission mutation, and other separately protected operational actions are included only when they were explicitly part of the agreed scope and their repository authorization/qualification rules are satisfied. A code-delivery \"ship it\" must not be stretched into an unrequested production mutation.\n\n## Approval 1 — exact-head merge approval"
          release_section = """Production deployment, destructive operations, credential/permission mutation, and other separately protected operational actions are included only when they were explicitly part of the agreed scope and their repository authorization/qualification rules are satisfied. A code-delivery \"ship it\" must not be stretched into an unrequested production mutation.\n\nUpdate documentation that the shipped change makes inaccurate or incomplete. Do not create documentation churn when documented behaviour did not change.\n\n## Owner release shorthand — \"release it\"\n\nWhen the repository owner says **\"release it\"**, treat that as authorization to qualify, publish, deploy, and verify the current qualified `main` without another routine approval.\n\nUnless the owner explicitly narrows or extends it, \"release it\" means:\n\n`current main → release-delta review → release notes + release-facing documentation → existing exact-SHA qualification → publish existing qualified artifact → established deployment path → existing post-deploy verification → compact completion report`\n\nReview the merged delta since the previous release for concrete integration, migration, compatibility, or operational blockers. Do not reopen already-reviewed implementation work without a concrete release risk.\n\nReuse existing GitHub Actions, release-artifact qualification, publication, deployment, rollback, and acceptance automation. Do not duplicate tests, builds, checksums, or rollout mechanics unless required evidence is missing or failing.\n\nRelease notes should summarize meaningful user- or operator-visible features, fixes, and operational changes rather than list commits. Update release-facing documentation when the combined release makes it inaccurate or incomplete; change-specific documentation belongs in the originating `ship it` work.\n\nIf the exact candidate SHA has the required green qualification evidence and no concrete release blocker remains, publish and deploy it through the established paths. If qualification or verification fails, follow the existing fail-closed deployment and rollback rules rather than weakening the release gate.\n\n## Approval 1 — exact-head merge approval"""
          if text.count(ship_anchor) != 1:
              raise SystemExit("release-it insertion anchor not found exactly once")
          text = text.replace(ship_anchor, release_section)

          path.write_text(text)
      - name: Commit documentation update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md
          git diff --cached --check
          git commit -m "docs: define release it workflow"
          git push origin HEAD:agent/release-it-docs
