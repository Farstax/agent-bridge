name: Temporary issue 637 reset-edge fix

on:
  push:
    branches: [oss-637-fallback-continuation-intent]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve fallback intent across context suppression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/engine.ts')
          s = p.read_text()
          old = '    const fallbackPrompt = shouldInject && isAgentKind(this.kind) && isProviderFallbackHandoffRequired(this.db, chatKey, this.kind)'
          new = '    const fallbackPrompt = nativeSessionMode === "fresh" && isAgentKind(this.kind) && isProviderFallbackHandoffRequired(this.db, chatKey, this.kind)'
          assert s.count(old) == 1, f'expected one fallback prompt seam, found {s.count(old)}'
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit reset-edge fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine.ts
          git commit -m 'fix: preserve fallback intent across context suppression'
          git push origin HEAD:${GITHUB_REF_NAME}
