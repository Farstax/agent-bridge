name: Issue 498 safety review repair

on:
  push:
    branches:
      - fix/issue-498-autonomy-config-convergence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-498-autonomy-config-convergence
          fetch-depth: 0
      - name: Apply safety repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/rollout-agent-bridge.sh")
          text = path.read_text()
          old = '''  [[ -d "$autonomy_parent" && ! -L "$autonomy_parent" && "$(/usr/bin/realpath -e "$autonomy_parent")" == "$autonomy_parent" ]] || die "autonomy database parent is missing or unsafe during config convergence"
            local parent_mode
            parent_mode="$(/usr/bin/stat -c %a "$autonomy_parent")"
            (( (8#$parent_mode & 022) == 0 )) || die "autonomy database parent must not be group/world writable"
            if (( test_mode == 0 )); then
              [[ "$(/usr/bin/stat -c %u "$autonomy_parent")" == "$(/usr/bin/id -u "$runtime_user")" ]] || die "autonomy database parent must be owned by the runtime user"
            fi

            local config_dir config_tmp config_current_mode
          '''
          new = '''  [[ -d "$autonomy_parent" && ! -L "$autonomy_parent" && "$(/usr/bin/realpath -e "$autonomy_parent")" == "$autonomy_parent" ]] || die "autonomy database parent is missing or unsafe during config convergence"
            local parent_mode
            parent_mode="$(/usr/bin/stat -c %a "$autonomy_parent")"
            (( (8#$parent_mode & 022) == 0 )) || die "autonomy database parent must not be group/world writable"
            if (( test_mode == 0 )); then
              [[ "$(/usr/bin/stat -c %u "$autonomy_parent")" == "$(/usr/bin/id -u "$runtime_user")" ]] || die "autonomy database parent must be owned by the runtime user"
            fi
            if [[ -e "$autonomy_database" || -L "$autonomy_database" ]]; then
              [[ -f "$autonomy_database" && ! -L "$autonomy_database" ]] || die "autonomy database target is occupied by an unsafe path: $autonomy_database"
              [[ "$(/usr/bin/realpath -e "$autonomy_database")" == "$autonomy_database" ]] || die "existing autonomy database target is not canonical: $autonomy_database"
            fi

            local config_dir config_tmp config_current_mode
          '''
          if text.count(old) != 1:
              raise SystemExit(f"anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          bash -n scripts/rollout-agent-bridge.sh
      - name: Commit repair and remove scaffolding
        shell: bash
        run: |
          rm -f .github/workflows/issue-498-safety-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/rollout-agent-bridge.sh .github/workflows/issue-498-safety-review-repair.yml
          git commit -m "fix: validate autonomy target before config mutation"
          git push origin HEAD:fix/issue-498-autonomy-config-convergence
