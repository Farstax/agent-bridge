name: OSS 482 apply

on:
  push:
    branches:
      - agent/oss-482-authorized-turn-search

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oss-482-authorized-turn-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Observe RED
        shell: bash
        run: |
          python scripts/issue482-apply.py red
          set +e
          npx vitest run test/issue482.red.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED test to fail before implementation" >&2
            exit 1
          fi
          git reset --hard HEAD
      - name: Apply implementation
        run: python scripts/issue482-apply.py apply
      - name: Focused GREEN
        run: npx vitest run test/contextCommand.test.ts test/conversationStore.test.ts test/canonicalConversationIdentity.test.ts
      - name: Repository qualification
        run: npm run qualify:local
        env:
          NODE_OPTIONS: --max-old-space-size=3072
      - name: Commit candidate
        shell: bash
        run: |
          rm .github/workflows/oss-482-apply.yml scripts/issue482-apply.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add authorized cross-conversation turn search"
          git push origin HEAD:agent/oss-482-authorized-turn-search
