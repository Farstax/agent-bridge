name: OSS 482 apply

on:
  push:
    branches:
      - agent/oss-482-authorized-turn-search
    paths-ignore:
      - .oss-482-test-failure.txt
      - scripts/issue482-finalize.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oss-482-authorized-turn-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Observe base RED
        shell: bash
        run: |
          python scripts/issue482-apply.py red
          set +e
          npx vitest run test/issue482.red.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected base RED test to fail before implementation" >&2
            exit 1
          fi
          git reset --hard HEAD
      - name: Apply base implementation
        run: python scripts/issue482-apply.py apply
      - name: Tighten owner-scope fixture
        run: sed -i 's/current conversation evidence/current local note/' test/conversationStore.test.ts
      - name: Focused base GREEN
        run: npx vitest run test/contextCommand.test.ts test/conversationStore.test.ts test/canonicalConversationIdentity.test.ts
      - name: Observe canonical-scope RED
        shell: bash
        run: |
          python scripts/issue482-repair.py red
          set +e
          npx vitest run test/issue482.repair.red.test.ts
          status=$?
          set -e
          rm -f test/issue482.repair.red.test.ts
          if [ "$status" -eq 0 ]; then
            echo "Expected canonical-scope RED test to fail before repair" >&2
            exit 1
          fi
      - name: Apply canonical-scope repair
        run: python scripts/issue482-repair.py apply
      - name: Audit retained-turn writers
        shell: bash
        run: grep -R -n --include='*.ts' 'addConvTurn(' src
      - name: Focused repair GREEN
        run: npx vitest run test/contextCommand.test.ts test/conversationStore.test.ts test/canonicalConversationIdentity.test.ts test/retainedConversationScope.test.ts test/dbSchema.test.ts test/commands.test.ts test/ownerNotificationIngress.test.ts
      - name: Full tests diagnostic
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          set +e
          npm test 2>&1 | tee /tmp/oss-482-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 500 /tmp/oss-482-vitest.log > .oss-482-test-failure.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .oss-482-test-failure.txt
            git commit -m "ci: capture oss 482 vitest failure"
            git push origin HEAD:agent/oss-482-authorized-turn-search
            exit "$status"
          fi
      - name: TypeScript diagnostic
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=3072
      - name: Architecture lint diagnostic
        run: bash scripts/arch-lint.sh src
      - name: Authoritative repository qualification
        run: npm run qualify:local
        env:
          NODE_OPTIONS: --max-old-space-size=3072
      - name: Commit candidate
        shell: bash
        run: |
          rm .github/workflows/oss-482-apply.yml scripts/issue482-apply.py scripts/issue482-repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add authorized cross-conversation turn search"
          git push origin HEAD:agent/oss-482-authorized-turn-search
