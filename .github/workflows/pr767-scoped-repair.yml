name: PR 767 scoped repair

on:
  push:
    branches: [feature/763-acp-session-config]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/763-acp-session-config
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Apply scoped repair
        run: python3 scripts/tmp-pr767-repair.py
      - name: Focused verification
        run: npx vitest run test/acpOpaqueEffort.test.ts test/acpTelegramConfigCallback.test.ts
      - name: Commit runtime repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts test/acpOpaqueEffort.test.ts test/acpTelegramConfigCallback.test.ts
          git commit -m "fix: validate ACP Telegram selections at live boundary"
          git push origin HEAD:feature/763-acp-session-config
