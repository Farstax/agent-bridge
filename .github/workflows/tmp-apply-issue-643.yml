name: Apply issue 643 patch

on:
  push:
    branches:
      - fix/643-claude-silent-exit-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/643-claude-silent-exit-recovery
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          supervisor = Path("src/cliSupervisor.ts")
          text = supervisor.read_text()
          start_marker = "      const safeStdout = redact(stdout);\n      const safeStderr = redact(stderr);\n"
          start = text.index(start_marker)
          end_marker = "      } else {\n        const validationError"
          end = text.index(end_marker, start) + len("      } else {")
          replacement = "\n".join([
              "      const safeStdout = redact(stdout);",
              "      const safeStderr = redact(stderr);",
              "      const rawOutputBytes = Buffer.byteLength(stdout) + Buffer.byteLength(stderr);",
              "      const safeOutputBytes = Buffer.byteLength(safeStdout) + Buffer.byteLength(safeStderr);",
              "      const redactionApplied = stdout !== safeStdout || stderr !== safeStderr;",
              "      const attachExitDiagnostics = (err: Error) => {",
              "        (err as any).stdout = safeStdout;",
              "        (err as any).stderr = safeStderr;",
              "        (err as any).exitCode = code;",
              "        (err as any).signal = signal;",
              "        (err as any).rawOutputBytes = rawOutputBytes;",
              "        (err as any).safeOutputBytes = safeOutputBytes;",
              "        (err as any).redactionApplied = redactionApplied;",
              "        return err;",
              "      };",
              "      if (signal || (code !== 0 && code !== null)) {",
              "        console.warn(`[cli-exit] bot=${options.bot ?? \"unknown\"} code=${code ?? \"null\"} signal=${signal ?? \"none\"} rawBytes=${rawOutputBytes} safeBytes=${safeOutputBytes} redacted=${redactionApplied}`);",
              "      }",
              "      if (signal && abortedChildren.has(child)) {",
              "        if (evtCtx) emit(evtType.runCancelled({ ...evtCtx, reason: \"user\" }));",
              "        doResolve({ stdout: safeStdout });",
              "      } else if (signal) {",
              "        const combined = [safeStderr.trim(), safeStdout.slice(-2000).trim()].filter(Boolean).join(\"\\n\");",
              "        const diagnostic = combined || \"(no diagnostic output)\";",
              "        const message = `CLI killed by signal ${signal}: ${diagnostic}`;",
              "        if (evtCtx) emit(evtType.runFailed({ ...evtCtx, error: combined ? `CLI killed by signal ${signal}` : message, category: \"cli\" }));",
              "        doReject(attachExitDiagnostics(new Error(message)));",
              "      } else if (code !== 0 && code !== null) {",
              "        const combined = [safeStderr.trim(), safeStdout.slice(-2000).trim()].filter(Boolean).join(\"\\n\");",
              "        const diagnostic = combined || \"(no diagnostic output)\";",
              "        const message = `CLI exited with code ${code}: ${diagnostic}`;",
              "        if (evtCtx) emit(evtType.runFailed({ ...evtCtx, error: combined ? `CLI exited with code ${code}` : message, category: \"cli\" }));",
              "        doReject(attachExitDiagnostics(new Error(message)));",
              "      } else {",
          ])
          supervisor.write_text(text[:start] + replacement + text[end:])

          engine = Path("src/engine.ts")
          text = engine.read_text()
          start_marker = "  private _handleCircuitBreaker(error: Error, chatKey: string, laneHandle: ExecutionLaneHandle): void {"
          start = text.index(start_marker)
          end = text.index("\n\n  async handleCallback", start)
          replacement = "\n".join([
              "  private _handleCircuitBreaker(error: Error, chatKey: string, laneHandle: ExecutionLaneHandle): void {",
              "    if (!isAgentKind(this.kind)) return;",
              "    const msg = error.message ?? \"\";",
              "    const silentResumedClaudeExit = this.kind === \"claude\"",
              "      && this.db.getSession(chatKey, \"claude\") !== null",
              "      && /^CLI exited with code 1: \\(no diagnostic output\\)$/.test(msg);",
              "    if (/timeout|killed by signal/i.test(msg) || silentResumedClaudeExit) {",
              "      this._runWithFence(laneHandle, () => {",
              "        const failures = this.db.incrementFailures(chatKey, this.kind as BotKind);",
              "        if (failures >= 2) {",
              "          console.warn(`[${this.kind}] clearing session after ${failures} consecutive failures for ${chatKey}`);",
              "          db_setSession(this.db, chatKey, this.kind as BotKind, null);",
              "          this.db.resetFailures(chatKey, this.kind as BotKind);",
              "        }",
              "      });",
              "    } else if (/No conversation found with session ID|thread not found|session not found|conversation not found/i.test(msg)) {",
              "      console.warn(`[${this.kind}] clearing invalid session ID for ${chatKey}`);",
              "      this._runWithFence(laneHandle, () => db_setSession(this.db, chatKey, this.kind as BotKind, null));",
              "      this.db.resetFailures(chatKey, this.kind);",
              "    }",
              "  }",
          ])
          engine.write_text(text[:start] + replacement + text[end:])
          PY

          git rm .github/workflows/tmp-apply-issue-643.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cliSupervisor.ts src/engine.ts test/issue643CliExitDiagnostics.test.ts test/issue643ClaudeCircuitBreaker.test.ts
          git commit -m "fix(claude): recover repeated silent resumed exits (#643)"
          git push origin HEAD:fix/643-claude-silent-exit-recovery
