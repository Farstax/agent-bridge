name: Apply issue 706 branch patch

on:
  push:
    branches: [fix/706-fresh-workspace-context]
    paths: [.github/workflows/apply-706-branch-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/706-fresh-workspace-context
          fetch-depth: 0

      - name: Apply scoped implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path("src/workspaceContext.ts")
          text = workspace.read_text()
          old = '''export function prependWorkspaceContext(prompt: string, env: NodeJS.ProcessEnv = process.env): string {
            const passive = passiveContextBlock();
            const managed = loadWorkspaceContext(env);
            const inspector = runtimeInspectorContext(env);
          '''
          new = '''export function prependWorkspaceContext(
            prompt: string,
            env: NodeJS.ProcessEnv = process.env,
            options: { includeManagedContext?: boolean } = {},
          ): string {
            const passive = passiveContextBlock();
            const managed = options.includeManagedContext === false ? "" : loadWorkspaceContext(env);
            const inspector = runtimeInspectorContext(env);
          '''
          if text.count(old) != 1:
              raise SystemExit("workspaceContext target did not match exactly once")
          workspace.write_text(text.replace(old, new))

          engine = Path("src/engine.ts")
          text = engine.read_text()
          old = '''    const workspacePrompt = this.opts.workspaceContext === undefined
                ? prependWorkspaceContext(contextPrompt)
                : (this.opts.workspaceContext ? `[Managed workspace context]\\n${this.opts.workspaceContext}\\n\\n${contextPrompt}` : contextPrompt);
          '''
          new = '''    const workspacePrompt = this.opts.workspaceContext === undefined
                ? prependWorkspaceContext(contextPrompt, process.env, { includeManagedContext: shouldInject })
                : (shouldInject && this.opts.workspaceContext
                    ? `[Managed workspace context]\\n${this.opts.workspaceContext}\\n\\n${contextPrompt}`
                    : contextPrompt);
          '''
          if text.count(old) != 1:
              raise SystemExit("engine target did not match exactly once")
          engine.write_text(text.replace(old, new))

          Path(".github/workflows/apply-706-branch-patch.yml").unlink()
          PY

      - name: Commit scoped implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts src/workspaceContext.ts .github/workflows/apply-706-branch-patch.yml
          git commit -m "fix: inject workspace context only on fresh sessions"
          git push origin HEAD:fix/706-fresh-workspace-context
