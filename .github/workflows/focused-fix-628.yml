name: Focused fix 628

on:
  push:
    branches:
      - fix/628-inspector-commit

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: python3 scripts/focused-fix-628.py
      - run: npm ci
      - name: Focused tests only
        run: npx vitest run test/runtimeInspector.test.ts
      - name: Commit tested fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtimeInspector.ts test/runtimeInspector.test.ts
          git rm -f .github/workflows/focused-fix-628.yml scripts/focused-fix-628.py .focused-fix-628
          git commit -m 'fix: expose deployed commit from release manifest (#628)'
          git push origin HEAD:fix/628-inspector-commit
