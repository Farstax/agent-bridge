name: Issue 716 review repair

on:
  push:
    branches: [fix/716-review-regressions]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/716-review-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Repair production-shaped compatibility regression coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          p = Path('test/issue716ReleaseCompatibility.test.ts')
          s = p.read_text()
          old = '''  it("stamps the published artifact identity that bridgeVersion reads by default", async () => {
    const root = runtimeRoot("runtime");
    expect(stampReleaseCompatibilityVersion(root, "release-2026.09.06-2")).toBe("2026.9.6-2");
    expect(JSON.parse(readFileSync(join(root, "package.json"), "utf8")).version).toBe("2026.9.6-2");
    expect(JSON.parse(readFileSync(join(root, "package-lock.json"), "utf8")).packages[""].version).toBe("2026.9.6-2");

    await expectCompatible(root, "2026.9.6-2");
  });'''
          new = '''  it("stamps the published artifact identity that bridgeVersion reads by default", async () => {
    const root = runtimeRoot("runtime");
    expect(stampReleaseCompatibilityVersion(root, "release-2026.09.07-2")).toBe("2026.9.7-2");
    expect(JSON.parse(readFileSync(join(root, "package.json"), "utf8")).version).toBe("2026.9.7-2");
    expect(JSON.parse(readFileSync(join(root, "package-lock.json"), "utf8")).packages[""].version).toBe("2026.9.7-2");

    await expectCompatible(root, "2026.9.7-2");
  });'''
          if old not in s: raise SystemExit('first compatibility test block not found')
          s = s.replace(old, new)

          old = '''  it("rejects pre-feature and malformed runtime versions, while exact and newer releases pass", async () => {
    const oldRoot = runtimeRoot("old");
    stampReleaseCompatibilityVersion(oldRoot, "release-2026.09.06-1");
    await expect(getAvailableSkillPack("marketing", {
      catalogueSource: writeCatalogue(oldRoot, "2026.9.6-2"),
      repoRoot: oldRoot,
    })).rejects.toThrow(/requires Agent Bridge >= 2026\\.9\\.6-2; current 2026\\.9\\.6-1/);

    const exactRoot = runtimeRoot("exact");
    stampReleaseCompatibilityVersion(exactRoot, "release-2026.09.06-2");
    await expectCompatible(exactRoot, "2026.9.6-2");

    const newerRoot = runtimeRoot("newer");
    stampReleaseCompatibilityVersion(newerRoot, "release-2026.09.07-1");
    await expectCompatible(newerRoot, "2026.9.6-2");

    const malformedRoot = runtimeRoot("malformed", "release-2026.09.06-2");
    await expect(getAvailableSkillPack("marketing", {
      catalogueSource: writeCatalogue(malformedRoot, "2026.9.6-2"),
      repoRoot: malformedRoot,
    })).rejects.toThrow(/Invalid semantic version/);
  });'''
          new = '''  it("rejects legacy unstamped and malformed runtime versions, while exact and newer stamped releases pass", async () => {
    const legacyRoot = runtimeRoot("legacy", "0.1.0");
    await expect(getAvailableSkillPack("marketing", {
      catalogueSource: writeCatalogue(legacyRoot, "2026.9.7-2"),
      repoRoot: legacyRoot,
    })).rejects.toThrow(/requires Agent Bridge >= 2026\\.9\\.7-2; current 0\\.1\\.0/);

    const exactRoot = runtimeRoot("exact");
    stampReleaseCompatibilityVersion(exactRoot, "release-2026.09.07-2");
    await expectCompatible(exactRoot, "2026.9.7-2");

    const newerRoot = runtimeRoot("newer");
    stampReleaseCompatibilityVersion(newerRoot, "release-2026.09.08-1");
    await expectCompatible(newerRoot, "2026.9.7-2");

    const malformedRoot = runtimeRoot("malformed", "release-2026.09.07-2");
    await expect(getAvailableSkillPack("marketing", {
      catalogueSource: writeCatalogue(malformedRoot, "2026.9.7-2"),
      repoRoot: malformedRoot,
    })).rejects.toThrow(/Invalid semantic version/);
  });'''
          if old not in s: raise SystemExit('legacy compatibility test block not found')
          s = s.replace(old, new)

          s = s.replace('await expectCompatible(root, "2026.9.6-2", { agentBridgeVersion: "2026.9.6-2" });', 'await expectCompatible(root, "2026.9.7-2", { agentBridgeVersion: "2026.9.7-2" });')
          s = s.replace('const releaseTag = "release-2026.09.06-2";\n    stampReleaseCompatibilityVersion(root, releaseTag);', 'const releaseTag = "release-2026.09.07-2";\n    stampReleaseCompatibilityVersion(root, releaseTag);')
          s = s.replace('expect(manifest.release).toEqual({ tag: releaseTag, compatibility_version: "2026.9.6-2" });', 'expect(manifest.release).toEqual({ tag: releaseTag, compatibility_version: "2026.9.7-2" });')
          s = s.replace('releaseTag: "release-2026.09.06-2",\n    })).toThrow(/package version 0\\.1\\.0 does not match compatibility version 2026\\.9\\.6-2/);', 'releaseTag: "release-2026.09.07-2",\n    })).toThrow(/package version 0\\.1\\.0 does not match compatibility version 2026\\.9\\.7-2/);')
          p.write_text(s)

          p = Path('test/releasePromotion.test.ts')
          s = p.read_text()
          s = s.replace('const releaseTag = "release-2026.09.07-1";', 'const releaseTag = "release-2026.09.07-2";')
          s = s.replace('const compatibilityVersion = "2026.9.7-1";', 'const compatibilityVersion = "2026.9.7-2";')
          s = s.replace('"release-2026.09.07-2");\n\n    expect(result.status).not.toBe(0);', '"release-2026.09.07-3");\n\n    expect(result.status).not.toBe(0);')
          p.write_text(s)

          p = Path('docs/GITHUB-RELEASES.md')
          s = p.read_text()
          s = s.replace('release-2026.09.06-2 -> 2026.9.6-2', 'release-2026.09.07-2 -> 2026.9.7-2')
          anchor = 'Release qualification stamps that compatibility version into the artifact\'s `package.json` and root `package-lock.json`, then records the same tag/version pair in `manifest.json`. Runtime code therefore reads the actual installed artifact identity through the normal package metadata path; operators do not need to set `AGENT_BRIDGE_VERSION`. Explicit version injection and `AGENT_BRIDGE_VERSION` remain override paths for tests/development.\n'
          note = '\nCompatibility identity is not retroactive. `release-2026.09.06-2` and `release-2026.09.07-1` were published before tag-bound stamping existed and retain the old `0.1.0` package identity. Skill Pack minimum-version metadata must anchor to the first artifact actually qualified with a stamped identity, not merely the first release whose code contains the Skill Pack mechanism.\n'
          if anchor not in s: raise SystemExit('GitHub releases compatibility anchor not found')
          s = s.replace(anchor, anchor + note)
          p.write_text(s)

          p = Path('docs/SKILL-PACKS.md')
          s = p.read_text()
          s = s.replace('Published Agent Bridge release tags such as `release-2026.09.06-2` map deterministically to runtime compatibility versions such as `2026.9.6-2`.', 'Published Agent Bridge release tags qualified with compatibility stamping, such as `release-2026.09.07-2`, map deterministically to runtime compatibility versions such as `2026.9.7-2`.')
          anchor = 'Compatibility is checked before Skill Pack mutation. A pack whose minimum runtime version is newer than the installed artifact is rejected before any shared Skill state is changed.\n'
          note = '\nMinimum-version metadata must use an identity the target release artifact actually carries. Historical releases published before compatibility stamping are not retroactively assigned their tag-derived version; choose the first stamped release (or a conservative lower bound that excludes every unstamped release).\n'
          if anchor not in s: raise SystemExit('Skill Packs compatibility anchor not found')
          s = s.replace(anchor, anchor + note)
          p.write_text(s)
          PY

          git add test/issue716ReleaseCompatibility.test.ts test/releasePromotion.test.ts docs/GITHUB-RELEASES.md docs/SKILL-PACKS.md
          git commit -m "test: cover real pre-identity release boundary"
          git push origin HEAD:fix/716-review-regressions

          npm ci
          npx vitest run test/issue716ReleaseCompatibility.test.ts test/releasePromotion.test.ts

          git rm .github/workflows/issue716-review-fix.yml
          git commit -m "chore: remove issue 716 review helper"
          git push origin HEAD:fix/716-review-regressions
