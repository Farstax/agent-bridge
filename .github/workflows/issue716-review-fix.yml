name: Issue 716 review repair

on:
  push:
    branches: [fix/716-review-regressions]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/716-review-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Repair production-shaped compatibility regression coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          def replace_exact(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
                  s = s.replace(old, new)
              p.write_text(s)
          replace_exact('test/issue716ReleaseCompatibility.test.ts', [
              ('expect(stampReleaseCompatibilityVersion(root, "release-2026.09.06-2")).toBe("2026.9.6-2");', 'expect(stampReleaseCompatibilityVersion(root, "release-2026.09.07-2")).toBe("2026.9.7-2");'),
              ('expect(JSON.parse(readFileSync(join(root, "package.json"), "utf8")).version).toBe("2026.9.6-2");', 'expect(JSON.parse(readFileSync(join(root, "package.json"), "utf8")).version).toBe("2026.9.7-2");'),
              ('expect(JSON.parse(readFileSync(join(root, "package-lock.json"), "utf8")).packages[""].version).toBe("2026.9.6-2");', 'expect(JSON.parse(readFileSync(join(root, "package-lock.json"), "utf8")).packages[""].version).toBe("2026.9.7-2");'),
              ('await expectCompatible(root, "2026.9.6-2");', 'await expectCompatible(root, "2026.9.7-2");'),
              ('it("rejects pre-feature and malformed runtime versions, while exact and newer releases pass", async () => {', 'it("rejects legacy unstamped and malformed runtime versions, while exact and newer stamped releases pass", async () => {'),
              ('const oldRoot = runtimeRoot("old");', 'const legacyRoot = runtimeRoot("legacy", "0.1.0");'),
              ('    stampReleaseCompatibilityVersion(oldRoot, "release-2026.09.06-1");\n', ''),
              ('catalogueSource: writeCatalogue(oldRoot, "2026.9.6-2"),', 'catalogueSource: writeCatalogue(legacyRoot, "2026.9.7-2"),'),
              ('repoRoot: oldRoot,', 'repoRoot: legacyRoot,'),
              ('requires Agent Bridge >= 2026\\.9\\.6-2; current 2026\\.9\\.6-1', 'requires Agent Bridge >= 2026\\.9\\.7-2; current 0\\.1\\.0'),
              ('stampReleaseCompatibilityVersion(exactRoot, "release-2026.09.06-2");', 'stampReleaseCompatibilityVersion(exactRoot, "release-2026.09.07-2");'),
              ('await expectCompatible(exactRoot, "2026.9.6-2");', 'await expectCompatible(exactRoot, "2026.9.7-2");'),
              ('stampReleaseCompatibilityVersion(newerRoot, "release-2026.09.07-1");', 'stampReleaseCompatibilityVersion(newerRoot, "release-2026.09.08-1");'),
              ('await expectCompatible(newerRoot, "2026.9.6-2");', 'await expectCompatible(newerRoot, "2026.9.7-2");'),
              ('const malformedRoot = runtimeRoot("malformed", "release-2026.09.06-2");', 'const malformedRoot = runtimeRoot("malformed", "release-2026.09.07-2");'),
              ('catalogueSource: writeCatalogue(malformedRoot, "2026.9.6-2"),', 'catalogueSource: writeCatalogue(malformedRoot, "2026.9.7-2"),'),
              ('await expectCompatible(root, "2026.9.6-2", { agentBridgeVersion: "2026.9.6-2" });', 'await expectCompatible(root, "2026.9.7-2", { agentBridgeVersion: "2026.9.7-2" });'),
              ('const releaseTag = "release-2026.09.06-2";', 'const releaseTag = "release-2026.09.07-2";'),
              ('expect(manifest.release).toEqual({ tag: releaseTag, compatibility_version: "2026.9.6-2" });', 'expect(manifest.release).toEqual({ tag: releaseTag, compatibility_version: "2026.9.7-2" });'),
              ('releaseTag: "release-2026.09.06-2",', 'releaseTag: "release-2026.09.07-2",'),
              ('package version 0\\.1\\.0 does not match compatibility version 2026\\.9\\.6-2', 'package version 0\\.1\\.0 does not match compatibility version 2026\\.9\\.7-2'),
          ])
          replace_exact('test/releasePromotion.test.ts', [
              ('const releaseTag = "release-2026.09.07-1";', 'const releaseTag = "release-2026.09.07-2";'),
              ('const compatibilityVersion = "2026.9.7-1";', 'const compatibilityVersion = "2026.9.7-2";'),
              ('runVerifier(fixture.artifactDir, fixture.commit, fixture.workflowRun, "release-2026.09.07-2");', 'runVerifier(fixture.artifactDir, fixture.commit, fixture.workflowRun, "release-2026.09.07-3");'),
          ])
          replace_exact('docs/GITHUB-RELEASES.md', [
              ('release-2026.09.06-2 -> 2026.9.6-2', 'release-2026.09.07-2 -> 2026.9.7-2'),
              ('Release qualification stamps that compatibility version into the artifact\'s `package.json` and root `package-lock.json`, then records the same tag/version pair in `manifest.json`. Runtime code therefore reads the actual installed artifact identity through the normal package metadata path; operators do not need to set `AGENT_BRIDGE_VERSION`. Explicit version injection and `AGENT_BRIDGE_VERSION` remain override paths for tests/development.', 'Release qualification stamps that compatibility version into the artifact\'s `package.json` and root `package-lock.json`, then records the same tag/version pair in `manifest.json`. Runtime code therefore reads the actual installed artifact identity through the normal package metadata path; operators do not need to set `AGENT_BRIDGE_VERSION`. Explicit version injection and `AGENT_BRIDGE_VERSION` remain override paths for tests/development.\n\nCompatibility identity is not retroactive. `release-2026.09.06-2` and `release-2026.09.07-1` were published before tag-bound stamping existed and retain the old `0.1.0` package identity. Skill Pack minimum-version metadata must anchor to the first artifact actually qualified with a stamped identity, not merely the first release whose code contains the Skill Pack mechanism.'),
          ])
          replace_exact('docs/SKILL-PACKS.md', [
              ('Published Agent Bridge release tags such as `release-2026.09.06-2` map deterministically to runtime compatibility versions such as `2026.9.6-2`.', 'Published Agent Bridge release tags qualified with compatibility stamping, such as `release-2026.09.07-2`, map deterministically to runtime compatibility versions such as `2026.9.7-2`.'),
              ('Compatibility is checked before Skill Pack mutation. A pack whose minimum runtime version is newer than the installed artifact is rejected before any shared Skill state is changed.', 'Compatibility is checked before Skill Pack mutation. A pack whose minimum runtime version is newer than the installed artifact is rejected before any shared Skill state is changed.\n\nMinimum-version metadata must use an identity the target release artifact actually carries. Historical releases published before compatibility stamping are not retroactively assigned their tag-derived version; choose the first stamped release (or a conservative lower bound that excludes every unstamped release).'),
          ])
          PY
          git add test/issue716ReleaseCompatibility.test.ts test/releasePromotion.test.ts docs/GITHUB-RELEASES.md docs/SKILL-PACKS.md
          git commit -m "test: cover real pre-identity release boundary"
          git push origin HEAD:fix/716-review-regressions
          npm ci
          npx vitest run test/issue716ReleaseCompatibility.test.ts test/releasePromotion.test.ts
          git rm .github/workflows/issue716-review-fix.yml
          git commit -m "chore: remove issue 716 review helper"
          git push origin HEAD:fix/716-review-regressions
