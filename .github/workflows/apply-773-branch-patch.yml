name: Apply issue 773 context-mode repair

on:
  push:
    branches:
      - fix/773-explicit-context-modes
    paths:
      - .github/workflows/apply-773-branch-patch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/773-explicit-context-modes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python .github/scripts/apply-773.py
      - name: Commit repair
        run: |
          rm .github/workflows/apply-773-branch-patch.yml .github/scripts/apply-773.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine.ts test/engine.test.ts .github/workflows/apply-773-branch-patch.yml .github/scripts/apply-773.py
          git commit -m "fix: replace sticky context suppression with invocation modes (#773)"
          git push origin HEAD:fix/773-explicit-context-modes
