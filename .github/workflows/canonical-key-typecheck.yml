name: Canonical key contract typecheck

on:
  push:
    branches:
      - fix/278-canonical-chat-key

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-typecheck') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/278-canonical-chat-key
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Repair remaining direct event contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/autonomousGoalRuntime.ts')
          text = p.read_text()
          old = 'eventContext: { runId, bot: current.bot, chatId: goalChatKey(goalId), threadId: undefined, serviceId: laneHandle.serviceId, acquisitionId: laneHandle.acquisitionId },'
          new = 'eventContext: { runId, bot: current.bot, chatId: goalChatKey(goalId), chatKey: goalChatKey(goalId), threadId: undefined, serviceId: laneHandle.serviceId, acquisitionId: laneHandle.acquisitionId },'
          if text.count(old) != 1:
              raise SystemExit(f'autonomous context match count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/health/eventIngress.ts')
          text = p.read_text()
          old = '''      chatId: HEALTH_RUN_CHAT_KEY,\n      threadId: undefined,'''
          new = '''      chatId: HEALTH_RUN_CHAT_KEY,\n      chatKey: HEALTH_RUN_CHAT_KEY,\n      threadId: undefined,'''
          if text.count(old) != 1:
              raise SystemExit(f'health context match count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomousGoalRuntime.ts src/health/eventIngress.ts
          git commit -m "fix: carry canonical key through direct event producers [canonical-typecheck-source2]"
          git push origin HEAD:fix/278-canonical-chat-key
      - run: npm ci
      - name: Capture contract verification
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          typecheck_status=$?
          npx vitest run test/canonicalConversationIdentity.test.ts test/eventStore.test.ts test/runIngress.test.ts test/autonomousGoalRuntime.test.ts test/health-event-ingress.test.ts > /tmp/tests.log 2>&1
          tests_status=$?
          set -e
          {
            echo "TYPECHECK_STATUS=$typecheck_status"
            cat /tmp/typecheck.log
            echo "FOCUSED_TEST_STATUS=$tests_status"
            cat /tmp/tests.log
          } > .canonical-typecheck-report.txt
      - name: Publish verification report
        shell: bash
        run: |
          git add .canonical-typecheck-report.txt
          git commit -m "chore: capture canonical key verification [canonical-typecheck-report2]"
          git push origin HEAD:fix/278-canonical-chat-key
