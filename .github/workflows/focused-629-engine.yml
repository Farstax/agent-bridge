name: Focused 629 engine regression

on:
  push:
    branches: [fix/629-authoritative-run-correlation]

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Focused tests
        run: npx vitest run test/scheduledRunCorrelationEngine.test.ts test/scheduledRoutines.test.ts test/runtimeInspector.test.ts test/scheduledOccurrenceCorrelationMigration.test.ts
      - name: Typecheck
        run: npm run typecheck
