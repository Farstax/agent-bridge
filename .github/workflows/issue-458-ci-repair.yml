name: Issue 458 CI repair

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/issue-458-advisor-skill

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-458-advisor-skill
          fetch-depth: 0

      - name: Apply test-maintenance repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Remove legacy /advisor Bridge-command diagnostics owned by the deleted pipeline.
          p = Path("test/commands.test.ts")
          text = p.read_text()
          imports = (
              'import { mkdtempSync, rmSync, writeFileSync } from "node:fs";\n'
              'import { tmpdir } from "node:os";\n'
              'import { join } from "node:path";\n'
          )
          assert imports in text
          text = text.replace(imports, "", 1)
          marker = '\nconst advisorEnvKeys = ['
          assert marker in text
          text = text[:text.index(marker)].rstrip() + "\n"
          p.write_text(text)

          # Delete the stale Bridge-owned Advisor prompt-affordance regression.
          p = Path("test/engine.test.ts")
          text = p.read_text()
          start = '    it("tells the agent how to call the advisor when it is enabled", async () => {'
          end = '  });\n\n  describe("/reset command"'
          assert start in text
          start_i = text.index(start)
          end_i = text.index(end, start_i)
          text = text[:start_i] + text[end_i:]
          p.write_text(text)

          # Keep exact-release default-skill expectations aligned with the bundled Advisor skill.
          p = Path("test/initialInstall.test.ts")
          text = p.read_text()
          old = '      "health-troubleshooting",\n    ];'
          new = '      "health-troubleshooting",\n      "advisor",\n    ];'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))

          # Return provider-native fixture output so the one-call matrix exercises the real parsers.
          p = Path("test/advisorBroker.test.ts")
          text = p.read_text()
          old = '  runCli = vi.fn().mockResolvedValue(JSON.stringify({ result: "Independent view" })),\n'
          new = (
              '  runCli = vi.fn().mockImplementation(async (command: string) => command.includes("codex")\n'
              '    ? JSON.stringify({ type: "item.completed", item: { type: "agent_message", text: "Independent view" } })\n'
              '    : JSON.stringify({ result: "Independent view" })),\n'
          )
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/commands.test.ts test/engine.test.ts test/initialInstall.test.ts test/advisorBroker.test.ts
          git commit -m "test: align advisor subtraction regressions"

      - name: Apply production repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Skill manifests require a non-empty string version.
          p = Path("skills/advisor/skill.json")
          text = p.read_text()
          old = '  "version": 1\n'
          new = '  "version": "1.0.0"\n'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))

          # Keep the broker socket open while the provider call is active so a caller abort
          # is observable as a peer close and can fence the advisor subprocess.
          p = Path("src/advisorBroker.ts")
          text = p.read_text()
          old_accept = '''  private accept(socket: Socket): void {
    let input = "";
    socket.setEncoding("utf8");
    socket.on("data", (chunk) => { input += chunk; });
    socket.on("end", () => {
      let settled = false;
      let executionId: string | null = null;
      const cancel = () => {
        if (!settled && executionId) void this.abortCli(executionId);
      };
      socket.once("close", cancel);
      void this.handleWireRequest(input, (id) => { executionId = id; }).then((response) => {
        settled = true;
        socket.off("close", cancel);
        if (!socket.destroyed) socket.end(`${JSON.stringify(response)}\\n`);
      });
    });
  }
'''
          new_accept = '''  private accept(socket: Socket): void {
    let input = "";
    let started = false;
    let settled = false;
    let executionId: string | null = null;
    const cancel = () => {
      if (!settled && executionId) void this.abortCli(executionId);
    };
    socket.once("close", cancel);
    socket.setEncoding("utf8");
    socket.on("data", (chunk) => {
      if (started) return;
      input += chunk;
      const newline = input.indexOf("\\n");
      if (newline === -1) return;
      started = true;
      const raw = input.slice(0, newline);
      void this.handleWireRequest(raw, (id) => { executionId = id; }).then((response) => {
        settled = true;
        socket.off("close", cancel);
        if (!socket.destroyed) socket.end(`${JSON.stringify(response)}\\n`);
      });
    });
    socket.on("end", () => {
      if (started || socket.destroyed) return;
      settled = true;
      socket.off("close", cancel);
      socket.end(`${JSON.stringify({ ok: false, error: "Invalid advisor broker request" })}\\n`);
    });
  }
'''
          assert text.count(old_accept) == 1
          text = text.replace(old_accept, new_accept, 1)
          old_send = '    socket.end(JSON.stringify(input));\n'
          new_send = '    socket.write(`${JSON.stringify(input)}\\n`);\n'
          assert text.count(old_send) == 1
          p.write_text(text.replace(old_send, new_send, 1))
          PY

          git add skills/advisor/skill.json src/advisorBroker.ts
          git commit -m "fix: repair bounded advisor capability path"

      - name: Verify focused regressions and typecheck
        run: |
          npm ci
          npx vitest run \
            test/advisorBroker.test.ts \
            test/advisorRouting.test.ts \
            test/skills.test.ts \
            test/systematicDebuggingSkill.test.ts \
            test/deliveryDirectivesSkill.test.ts \
            test/initialInstall.test.ts \
            test/commands.test.ts \
            test/engine.test.ts
          npm run typecheck

      - name: Push repair commits
        run: git push origin HEAD:agent/issue-458-advisor-skill
