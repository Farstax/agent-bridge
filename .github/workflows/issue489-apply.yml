name: Apply issue 489 final patch

on:
  push:
    branches:
      - agent/issue-489-native-completion-subtraction

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-489-native-completion-subtraction
      - name: Apply exact final patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue489/patch.* | base64 -d | gzip -d > /tmp/issue489.patch
          git apply --binary --check /tmp/issue489.patch
          git apply --binary /tmp/issue489.patch
          rm -rf .issue489
          rm -f .github/workflows/issue489-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: delegate native background completion to providers"
          git push origin HEAD:agent/issue-489-native-completion-subtraction
